name: Short descriptive flow name
environment: preview
application_url: https://example.test
account_role: Owner
window:
  title: Product - Flow Name
  width: 1280
  height: 800
capture:
  microphone: false
  system_audio: false
  webcam: false
  upload: false
starting_state:
  description: Exact state required before recording
  assertion: Visible text or API condition
mutations:
  - Exact business mutation the user approved
expected_warnings:
  - Warning text that may be acknowledged
steps:
  - target: Semantic role, label, or text
    action: click | fill | select | press | wait
    value: Optional value
    mutation: false
    success: Exact visible or API state after the action
final_state:
  assertion: Exact visible or API condition proving completion
editing:
  crop:
    top_px: 0
    right_px: 0
    bottom_px: 0
    left_px: 0
  aspect_ratio: "16:9"
  auto_zoom: false
