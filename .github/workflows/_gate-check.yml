name: _Verify production gate

# TEMPORARY. Exists only to satisfy issue #36's acceptance criterion:
#
#   "Confirmed by observing a real run pause at the approval step, not just by
#    reading settings"
#
# Reading the environment settings proves the rule exists; it does not prove a
# workflow job actually stops. This job does nothing except claim the
# `production` environment, so the pause can be observed without touching a live
# fuel station. Deleted in the following commit once observed.

on:
  push:
    branches:
      - ci/release-safety

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Prove the gate was crossed
        run: echo "If this line ran, a human approved the production environment."
