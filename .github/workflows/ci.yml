name: CI

# Blocking checks for every pull request and for pushes to the long-lived
# branches. Nothing should reach `dev` (preview) or `main` (production) without
# passing these.
#
# Mark `verify` as a REQUIRED status check:
#   Settings -> Branches -> add a rule for `main` and for `dev`
#     [x] Require a pull request before merging
#     [x] Require status checks to pass -> select "verify"
#
# Kept deliberately cheap (one ubuntu job) so it stays fast enough to run on
# every push.

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Project references across the monorepo. Also emits packages/*/dist,
      # which the workspace tests and app builds resolve against.
      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm run test --workspaces --if-present

      # `scripts/` is not a workspace, so the line above skips it. These are the
      # lint-ratchet guards; an untested guard that quietly stops working puts
      # the count back to meaning nothing, which is the whole point of #75/#78.
      - name: Test guard scripts
        run: npm run test:scripts

      # Catches breakage the typechecker misses (Vite resolution, bad imports
      # in non-TS assets) before it reaches a deploy.
      - name: Build
        run: npm run build --workspaces --if-present

  # Guarantees only a real database can make: partial unique indexes, CHECK
  # constraints, RLS denial for tenant roles, and `SELECT ... FOR UPDATE`
  # actually serializing two concurrent Station-capacity checks. Fakes cannot
  # show any of those, and each one is a promise a customer would feel.
  #
  # Separate job because it needs a service container the other checks do not,
  # and because a database failure should never read as a unit-test failure.
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pumpos_test
        ports:
          - 5432:5432
        # Give the job a database that is actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npx tsc -b
      - name: Integration tests
        env:
          # The suite creates and drops its own schema, so it is safe against
          # any database; CI still gets a throwaway one.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pumpos_test
        run: npx vitest run apps/api/src/infra/repositories/__integration__

  # One migration source of truth (#270). packages/db/migrations (drizzle
  # journal) is authoritative; supabase/migrations is derived from it. Each
  # step below is red on one way the two drifted apart in #268:
  #
  #   generate no-op      schema.ts edited without `npm run db:generate`
  #   db:check (chain)    a generated migration hand-edited after the fact
  #                       (0008: SQL pruned, snapshot kept the columns), or a
  #                       SQL file the journal never ships
  #   db:check (derived)  a hand-written file in supabase/migrations
  #                       (4f19336: RLS rewrite that only one chain ran)
  #   fresh provision     the chain fails to apply, or leaves a table without
  #                       RLS (the preview DB served every table to anon)
  migrations:
    name: migrations (single source)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # db:check reads schema.ts from packages/db/dist.
      - name: Build packages
        run: npx tsc -b

      - name: drizzle-kit generate is a no-op
        working-directory: packages/db
        run: |
          npx drizzle-kit generate
          changes="$(git status --porcelain -- migrations)"
          if [ -n "$changes" ]; then
            echo "::error::src/schema.ts changed without a migration. Run 'npm run db:generate -w @pump/db' and commit the result."
            echo "$changes"
            exit 1
          fi

      - name: Chain consistent, derived folder in sync, applies fresh
        env:
          CHAIN_CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run db:check -w @pump/db

      # What `supabase start` does: replay the derived folder in filename
      # order into an empty database, then assert tenancy on the result.
      - name: Replay supabase/migrations and assert RLS
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb replay
          for f in supabase/migrations/*.sql; do
            psql -q -v ON_ERROR_STOP=1 -d replay -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d replay -f supabase/tests/rls_tenancy.test.sql

  # Separate job so a lint failure is instantly distinguishable from a broken
  # test, and so lint problems never mask a real regression.
  #
  # Formatting is Prettier's, and it is absolute: `format:check` fails on any
  # unformatted file. Run `npm run format` to fix. The lint config carries no
  # stylistic rules, so the two tools never disagree.
  #
  # ESLint is a RATCHET, not a wall. The pre-existing violations are recorded
  # in eslint-suppressions.json, so today's code passes. Only NEW violations of
  # the error-level rules fail. Warnings (currently ~7.2k, mostly `any`-related)
  # never fail the build — run `npm run lint:warnings` to see them.
  #
  # Two guards keep that number honest, because a ratchet is only worth having
  # if the count cannot be quietly edited:
  #
  #   scripts/check-no-hook-disables.mjs      (run by `npm run lint`)
  #     Inline `eslint-disable` comments for react-hooks rules are invisible to
  #     `--prune-suppressions`, so the file could read `{}` while violations
  #     remained in the source. That is what happened in #75.
  #
  #   scripts/check-suppressions-not-grown.mjs   (the step below)
  #     Nothing stopped the file itself growing: `npm run lint:baseline` plus a
  #     commit took the build green again (#78). Totals are compared against the
  #     merge base, so moving a suppression is fine and only a net increase
  #     fails. Put [ratchet] in the PR title when an increase is deliberate.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the base branch to diff the suppression baseline against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cheap and needs no build output, so it runs first and fails fast.
      - name: Prettier
        run: npm run format:check

      # Type-aware rules need the declaration output of the workspace packages.
      - name: Build types
        run: npx tsc -b

      # Runs the inline-disable check first; see the note above.
      - name: ESLint
        run: npm run lint

      # Only meaningful on a pull request: on a push to dev/main the merge has
      # already happened and there is nothing to compare against.
      - name: Suppression baseline has not grown
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git show "$BASE_SHA:eslint-suppressions.json" > /tmp/base-suppressions.json 2>/dev/null \
            || echo '{}' > /tmp/base-suppressions.json
          allow=""
          case "$PR_TITLE" in
            *'[ratchet]'*|*'[RATCHET]'*) allow="--allow-growth" ;;
          esac
          node scripts/check-suppressions-not-grown.mjs \
            /tmp/base-suppressions.json eslint-suppressions.json $allow

  # Marketing is a standalone install with its own lockfile (Astro 7 / Vite 8),
  # so it cannot share the workspace install above. It carries its own ESLint
  # config and suppression baseline for the same reason.
  marketing:
    name: marketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            affected:
              - 'apps/marketing/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.affected == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.affected == 'true'
        working-directory: apps/marketing
      - run: npm run lint
        if: steps.changes.outputs.affected == 'true'
        working-directory: apps/marketing
      - run: npm run build
        if: steps.changes.outputs.affected == 'true'
        working-directory: apps/marketing
      - name: Not affected
        if: steps.changes.outputs.affected != 'true'
        run: echo "Marketing files did not change; required check passes without rebuilding."
