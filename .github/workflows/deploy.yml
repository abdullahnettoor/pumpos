name: Deploy

# Deploys the web surfaces (console, marketing, mobile, api).
#
#   merge a PR to main    -> Tag release workflow tags vX.Y.Z and calls this
#                            workflow with mode=production (see tag-release.yml)
#   git tag vX.Y.Z + push -> PRODUCTION release (top-level wrangler config)
#   push to dev           -> PREVIEW release (env.preview custom domains)
#   Actions -> Deploy     -> PREVIEW deploy on demand (choose app)
#
# Plain pushes to non-dev branches do not build.
#
# PRODUCTION deploys every app (no path filtering) so the whole surface matches
# the released tag. PREVIEW deploys only the apps whose paths changed.
#
# Production deploys run in the `production` GitHub Environment. Add a
# required reviewer there (Settings -> Environments -> production -> Required
# reviewers) so live stations are never touched without an explicit approval.
#
# Required REPOSITORY secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   PROD_SUPABASE_URL, PROD_SUPABASE_PUBLISHABLE_KEY, PROD_API_URL
# Optional preview/dev secrets:
#   DEV_SUPABASE_URL, DEV_SUPABASE_PUBLISHABLE_KEY
# Optional REPOSITORY variables:
#   PREVIEW_API_URL         defaults to https://api.pumpos.abdullahnettoor.com
#   MARKETING_SITE          defaults to https://pumpos.app for tags
#   CONSOLE_URL             defaults to https://console.pumpos.app for tags
#   DOWNLOAD_MANIFEST_URL   empty => bundled placeholder manifest

on:
  push:
    branches:
      - dev
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      app:
        description: Which app(s) to deploy to PREVIEW
        type: choice
        default: all
        options: [all, console, marketing, mobile, api]
  # Called by tag-release.yml after it creates the vX.Y.Z tag. A tag pushed with
  # the default GITHUB_TOKEN does NOT re-trigger workflows, so production
  # deploys are invoked directly instead of relying on the tag push above.
  workflow_call:
    inputs:
      mode:
        description: production | preview
        type: string
        default: preview
      version:
        description: Release version being deployed (e.g. 1.2.3)
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.mode || 'auto' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      api: ${{ steps.filter.outputs.api }}
      console: ${{ steps.filter.outputs.console }}
      marketing: ${{ steps.filter.outputs.marketing }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve deploy mode
        id: mode
        run: |
          if [ "${{ inputs.mode }}" = "production" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'
            console:
              - 'apps/console/**'
              - 'packages/ui/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'
            marketing:
              - 'apps/marketing/**'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/ui/**'
              - 'packages/shared/**'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'

  console:
    needs: changes
    if: needs.changes.outputs.mode == 'production' || contains(fromJSON('["all","console"]'), github.event.inputs.app) || (github.event_name == 'push' && github.ref_name == 'dev' && needs.changes.outputs.console == 'true')
    runs-on: ubuntu-latest
    # Gate: the `production` environment carries a required-reviewer rule, so a
    # human approves before live stations are touched. `preview` is ungated.
    environment:
      name: ${{ needs.changes.outputs.mode == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select environment config
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            echo "VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" >> "$GITHUB_ENV"
            echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> "$GITHUB_ENV"
          else
            [ -n "${{ secrets.DEV_SUPABASE_URL }}" ] && echo "VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" >> "$GITHUB_ENV"
            [ -n "${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" ] && echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" >> "$GITHUB_ENV"
            echo "VITE_API_URL=${{ vars.PREVIEW_API_URL || 'https://api.pumpos.abdullahnettoor.com' }}" >> "$GITHUB_ENV"
          fi
      - name: Build console
        run: npm run build:ui-console
      - name: Deploy console
        working-directory: apps/console
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  marketing:
    needs: changes
    if: needs.changes.outputs.mode == 'production' || contains(fromJSON('["all","marketing"]'), github.event.inputs.app) || (github.event_name == 'push' && github.ref_name == 'dev' && needs.changes.outputs.marketing == 'true')
    runs-on: ubuntu-latest
    # Gate: the `production` environment carries a required-reviewer rule, so a
    # human approves before live stations are touched. `preview` is ungated.
    environment:
      name: ${{ needs.changes.outputs.mode == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Marketing is a standalone install (own lockfile, not an npm
          # workspace): its Astro 7 / Vite 8 tree must not share hoisting with
          # the app shells' Vite 5.
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
        working-directory: apps/marketing
      - name: Build marketing
        run: npm run build
        working-directory: apps/marketing
        env:
          SITE: ${{ needs.changes.outputs.mode == 'production' && (vars.MARKETING_SITE || 'https://pumpos.app') || 'https://pumpos.abdullahnettoor.com' }}
          PUBLIC_CONSOLE_URL: ${{ needs.changes.outputs.mode == 'production' && (vars.CONSOLE_URL || 'https://console.pumpos.app') || 'https://console.pumpos.abdullahnettoor.com' }}
          PUBLIC_DOWNLOAD_MANIFEST_URL: ${{ vars.DOWNLOAD_MANIFEST_URL }}
      - name: Deploy marketing
        working-directory: apps/marketing
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  mobile:
    needs: changes
    if: needs.changes.outputs.mode == 'production' || contains(fromJSON('["all","mobile"]'), github.event.inputs.app) || (github.event_name == 'push' && github.ref_name == 'dev' && needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    # Gate: the `production` environment carries a required-reviewer rule, so a
    # human approves before live stations are touched. `preview` is ungated.
    environment:
      name: ${{ needs.changes.outputs.mode == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select environment config
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            echo "VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}" >> "$GITHUB_ENV"
            echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> "$GITHUB_ENV"
          else
            [ -n "${{ secrets.DEV_SUPABASE_URL }}" ] && echo "VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" >> "$GITHUB_ENV"
            [ -n "${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" ] && echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}" >> "$GITHUB_ENV"
            echo "VITE_API_URL=${{ vars.PREVIEW_API_URL || 'https://api.pumpos.abdullahnettoor.com' }}" >> "$GITHUB_ENV"
          fi
      - name: Build mobile
        run: npm run build:ui-mobile
      - name: Deploy mobile
        working-directory: apps/mobile
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  api:
    needs: changes
    if: needs.changes.outputs.mode == 'production' || contains(fromJSON('["all","api"]'), github.event.inputs.app) || (github.event_name == 'push' && github.ref_name == 'dev' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    # Gate: the `production` environment carries a required-reviewer rule, so a
    # human approves before live stations are touched. `preview` is ungated.
    environment:
      name: ${{ needs.changes.outputs.mode == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace deps
        run: npm run build:api
      - name: Deploy API
        working-directory: apps/api
        run: |
          if [ "${{ needs.changes.outputs.mode }}" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env preview
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
