name: Publish Blog

# Publishes the marketing site to pumpos.app without an app release (#653).
#
# Blog (default): builds the website code that is live, with the blog folder
# taken from dev, and deploys marketing only. Production gets new posts and
# nothing else unreleased: no tag, no desktop build, no app or page changes.
#
# Whole site: builds the entire marketing site from dev, after a production
# approval, for website-only changes (layout, pages, styling) that should not
# wait for an app release. The approval is where to confirm no page describes
# a feature stations don't have yet.
#
#   push to dev (blog folder)         -> blog, deploys now: a post merged, or a
#                                        live post edited
#   schedule                          -> daily 00:30 UTC (06:00 IST), blog;
#                                        deploys only when the posts that
#                                        should be live differ from
#                                        pumpos.app's RSS (a dated post came
#                                        due). A date-only publishedAt is
#                                        05:30 IST, so it goes out that morning.
#   Actions -> Publish Blog (blog)    -> deploys now, e.g. a post timed for a
#                                        precise hour
#   Actions -> Publish Blog (site)    -> whole site from dev, after approval
#
# The `marketing-live` tag marks the commit whose website code a whole-site
# publish put on pumpos.app. Blog runs build from that commit instead of main
# until a release brings main past it, so a post coming due never rolls the
# site back. A release deploy builds main's own site; the next daily run
# restores any post that reached dev after the release was cut.
#
# Scheduled runs use this file from the default branch (dev).

on:
  push:
    branches: [dev]
    paths: ['apps/marketing/src/content/blog/**']
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'blog: posts only. site: the whole marketing site from dev (needs production approval)'
        type: choice
        default: blog
        options: [blog, site]

permissions:
  contents: read

concurrency:
  group: publish-blog
  cancel-in-progress: false

env:
  SITE: ${{ vars.MARKETING_SITE || 'https://pumpos.app' }}
  PUBLIC_CONSOLE_URL: ${{ vars.CONSOLE_URL || 'https://console.pumpos.app' }}
  PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  PUBLIC_DEMO_BOOKING_URL: ${{ vars.DEMO_BOOKING_URL }}

jobs:
  publish:
    name: Publish blog
    if: inputs.scope != 'site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build from the website code that is live
        run: |
          git fetch --force origin 'refs/tags/marketing-live:refs/tags/marketing-live' 2>/dev/null || true
          if git rev-parse -q --verify refs/tags/marketing-live >/dev/null \
            && ! git merge-base --is-ancestor marketing-live HEAD; then
            echo "::notice::Building from marketing-live: a whole-site publish is ahead of main."
            git checkout -q marketing-live
          fi

      - name: Take the blog folder from dev
        run: |
          git fetch --depth=1 origin dev
          rm -rf apps/marketing/src/content/blog
          git checkout FETCH_HEAD -- apps/marketing/src/content/blog

      - name: Decide whether to deploy
        id: decide
        working-directory: apps/marketing
        run: |
          # The site hides scheduled posts only once it carries src/blog.ts.
          if [ ! -f src/blog.ts ]; then
            echo "::notice::The live site cannot schedule posts yet; publishing starts after the next release."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif node scripts/blog-due.mjs "$SITE"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Build marketing
        if: steps.decide.outputs.run == 'true'
        working-directory: apps/marketing
        run: |
          npm ci
          npm run build
          npm run check:links

      - name: Deploy marketing
        if: steps.decide.outputs.run == 'true'
        working-directory: apps/marketing
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check marketing
        if: steps.decide.outputs.run == 'true'
        run: node scripts/smoke-deploy.mjs marketing "$SITE"

  publish-site:
    name: Publish whole site
    if: inputs.scope == 'site'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json

      - name: Build marketing
        working-directory: apps/marketing
        run: |
          npm ci
          npm run build
          npm run check:links

      - name: Deploy marketing
        working-directory: apps/marketing
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check marketing
        run: node scripts/smoke-deploy.mjs marketing "$SITE"

      - name: Mark the live website code
        run: |
          git tag -f marketing-live
          git push -f origin refs/tags/marketing-live
