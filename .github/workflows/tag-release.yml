name: Tag release

# Production release on merge to main.
#
#   dev PR -> merge to dev        -> Deploy (preview)
#   `npm run release -- patch`    -> bumps the version across the monorepo
#   dev PR -> merge to main       -> THIS workflow: tags vX.Y.Z from the root
#                                    package.json version, publishes a GitHub
#                                    Release, then runs Deploy in production mode.
#
# The version is the single source of truth in the root package.json — CI never
# invents one. If the tag already exists (nothing was bumped since the last
# release) the tag + deploy are skipped, so re-merges are safe and idempotent.
#
# Desktop installers stay opt-in: tag `desktop-vX.Y.Z` manually (see
# desktop-release.yml) because macOS/Windows runner minutes are expensive.
#
# Database migrations stay manual and deliberate (Actions -> "DB migrate" ->
# prod). Run them BEFORE merging a release that depends on new schema.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.version.outputs.created }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version and check tag
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $tag already exists — skipping tag + production deploy."
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.version.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "PumpOS ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        if: steps.version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "PumpOS ${{ steps.version.outputs.tag }}" \
            --generate-notes

  # A tag pushed with GITHUB_TOKEN does not re-trigger deploy.yml's tag trigger,
  # so production deploys are invoked explicitly here.
  deploy:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      mode: production
      version: ${{ needs.tag.outputs.version }}
