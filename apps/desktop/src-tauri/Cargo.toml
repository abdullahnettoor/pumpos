[package]
name = "pumpos"
version = "1.0.0"
description = "PumpOS Desktop Shell"
authors = ["DeepMind Team"]
edition = "2021"

[lib]
name = "pumpos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Desktop-only: the in-app updater and the controlled relaunch that follows an
# install. Mobile has no updater path (stores own that), so these never build
# for iOS/Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"

[patch.crates-io]
alloc-no-stdlib = { git = "https://github.com/dropbox/rust-alloc-no-stdlib.git" }
alloc-stdlib = { git = "https://github.com/dropbox/rust-alloc-no-stdlib.git" }
