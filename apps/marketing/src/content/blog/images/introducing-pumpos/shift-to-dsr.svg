<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6a53"/>
    </marker>
  </defs>
  <rect width="760" height="780" fill="#ffffff"/>
  <text x="36" y="62" fill="#18201a" font-size="32" font-weight="800">From Shift to DSR</text>
  <text x="36" y="100" fill="#5e6a61" font-size="24">Each report is saved when its window closes</text>

  <rect x="20" y="124" width="720" height="72" rx="14" fill="#0f2a21"/>
  <text x="380" y="170" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">Business Day</text>

  <g stroke="#1f6a53" stroke-width="3" marker-end="url(#arrow)">
    <line x1="190" y1="196" x2="190" y2="226"/>
    <line x1="570" y1="196" x2="570" y2="226"/>
    <line x1="190" y1="352" x2="190" y2="382"/>
    <line x1="570" y1="352" x2="570" y2="382"/>
    <line x1="190" y1="474" x2="190" y2="504"/>
    <line x1="570" y1="474" x2="570" y2="504"/>
  </g>

  <g font-size="24" fill="#18201a">
    <rect x="20" y="234" width="340" height="118" rx="14" fill="#f6f7f4" stroke="#d9ded6" stroke-width="2"/>
    <text x="44" y="276" font-size="28" font-weight="800">Shift 1</text>
    <text x="44" y="312" fill="#5e6a61">Nozzle readings</text>
    <text x="44" y="340" fill="#5e6a61">Attendant drawers</text>

    <rect x="400" y="234" width="340" height="118" rx="14" fill="#f6f7f4" stroke="#d9ded6" stroke-width="2"/>
    <text x="424" y="276" font-size="28" font-weight="800">Shift 2</text>
    <text x="424" y="312" fill="#5e6a61">Nozzle readings</text>
    <text x="424" y="340" fill="#5e6a61">Attendant drawers</text>

    <rect x="20" y="390" width="340" height="84" rx="14" fill="#ffffff" stroke="#1f6a53" stroke-width="2"/>
    <text x="44" y="426" font-weight="800" fill="#1f6a53">Shift Summary</text>
    <text x="44" y="458" fill="#5e6a61" font-size="22">saved at shift close</text>

    <rect x="400" y="390" width="340" height="84" rx="14" fill="#ffffff" stroke="#1f6a53" stroke-width="2"/>
    <text x="424" y="426" font-weight="800" fill="#1f6a53">Shift Summary</text>
    <text x="424" y="458" fill="#5e6a61" font-size="22">saved at shift close</text>

    <rect x="20" y="512" width="720" height="100" rx="14" fill="#e5f0eb" stroke="#1f6a53" stroke-width="2"/>
    <text x="44" y="554" font-size="28" font-weight="800" fill="#1f6a53">DSR</text>
    <text x="44" y="590" fill="#18201a">Saved at day close, never recalculated</text>

    <rect x="20" y="648" width="720" height="108" rx="14" fill="#ffffff" stroke="#5e6a61" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="44" y="688" font-weight="800">Office records sit apart</text>
    <text x="44" y="722" fill="#5e6a61" font-size="22">Bank collections, expenses and supplier payments</text>
    <text x="44" y="748" fill="#5e6a61" font-size="22">never rewrite a saved report.</text>
  </g>
</svg>
