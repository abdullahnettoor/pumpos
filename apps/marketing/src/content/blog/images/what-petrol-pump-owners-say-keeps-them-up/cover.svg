<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0f2a21"/>
  <circle cx="1080" cy="80" r="260" fill="#1f6a53" opacity="0.35"/>
  <text x="80" y="118" fill="#8fd1b4" font-size="22" font-weight="700" letter-spacing="3">PUMPOS JOURNAL · OWNERS</text>
  <text x="80" y="210" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1.5">What keeps pump</text>
  <text x="80" y="290" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-1.5">owners up in 2026</text>
  <text x="80" y="346" fill="#b9cdc4" font-size="26">In their words: margins, credit, staff and stock.</text>

  <g font-size="18" font-weight="700">
    <rect x="80" y="430" width="242" height="104" rx="14" fill="#173a2e" stroke="#2f5c4b"/>
    <text x="102" y="470" fill="#8fd1b4" font-size="16">MARGIN</text>
    <text x="102" y="508" fill="#ffffff">₹2–3 a litre</text>

    <rect x="346" y="430" width="242" height="104" rx="14" fill="#173a2e" stroke="#2f5c4b"/>
    <text x="368" y="470" fill="#8fd1b4" font-size="16">CREDIT</text>
    <text x="368" y="508" fill="#ffffff">"Might never return"</text>

    <rect x="612" y="430" width="242" height="104" rx="14" fill="#173a2e" stroke="#2f5c4b"/>
    <text x="634" y="470" fill="#8fd1b4" font-size="16">STAFF</text>
    <text x="634" y="508" fill="#ffffff">Ten hands on cash</text>

    <rect x="878" y="430" width="242" height="104" rx="14" fill="#173a2e" stroke="#2f5c4b"/>
    <text x="900" y="470" fill="#8fd1b4" font-size="16">STOCK</text>
    <text x="900" y="508" fill="#ffffff">Water in E20</text>
  </g>
</svg>
