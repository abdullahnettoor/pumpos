<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="36" y="62" fill="#18201a" font-size="32" font-weight="800">Daily volume, before and after</text>
  <text x="36" y="100" fill="#5e6a61" font-size="24">One owner's figures, new pumps opened nearby</text>

  <text x="36" y="168" fill="#18201a" font-size="24">Before</text>
  <rect x="36" y="184" width="660" height="64" rx="10" fill="#1f6a53"/>
  <text x="672" y="227" fill="#ffffff" font-size="28" font-weight="800" text-anchor="end">12 KL</text>

  <text x="36" y="306" fill="#18201a" font-size="24">Now, on good days</text>
  <rect x="36" y="322" width="330" height="64" rx="10" fill="#1f6a53"/>
  <rect x="366" y="322" width="55" height="64" fill="#e5f0eb" stroke="#1f6a53" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="441" y="365" fill="#18201a" font-size="28" font-weight="800">6–7 KL</text>

  <text x="36" y="440" fill="#5e6a61" font-size="24">The margin stays about ₹2–3 a litre.</text>
</svg>
