<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#f3f5f2" />
    <!--
      Pre-paint theme: sets the light/dark class on <html> and the theme-color
      meta before first paint (no flash). Mirrors resolveTheme/applyTheme in
      src/theme/theme.ts (pinned by prepaint.test.ts). The __PLACEHOLDERS__ are
      filled by vite.config.ts. Appearance is not shipped, so this is Light
      unless the dev-only ?theme= switch is on.
    -->
    <script>
      (function () {
        try {
          var theme = 'light';
          var force = null;
          if (__THEME_DEV_SWITCH__) {
            var m = /[?&]theme=(light|dark)(&|$)/.exec(location.search);
            if (m) force = m[1];
          }
          if (force) {
            theme = force;
          } else if (__APPEARANCE_ENABLED__) {
            var p = localStorage.getItem('pump.mobile.theme');
            theme =
              p === 'light' || p === 'dark'
                ? p
                : matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0f0d' : '#f3f5f2');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>PumpOS Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
