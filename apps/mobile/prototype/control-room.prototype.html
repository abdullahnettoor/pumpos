<!doctype html>
<!--
  PROTOTYPE — throwaway. Not wired to the app.
  Question: "Variant B (control room) won — what do the other tabs look like in
  it, in dark AND light?"
  Pages: Home · Shifts (+summary) · Reports (+DSSR) · Money · Insights · Alerts · Account. Tap the dock inside the
  phone, use the floating bar / ←→, or ?page=home|shifts|reports|money|insights.
  Theme: ?theme=dark|light or the ◐ button / "t" key. ?page=all shows every page.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PumpOS mobile — Control room pages (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100vh; font-family: var(--font-sans); background: #eceeea; }
  body.darkpage { background: #1a1d1b; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  input { font: inherit; }
  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; letter-spacing: -0.02em; }
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 8px 0 90px; flex-wrap: wrap; }
  .phone { width: 375px; height: 780px; border-radius: 44px; padding: 10px; background: #000; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); flex-shrink: 0; }
  .cap { font: 700 13px var(--font-sans); margin: 0 0 10px 6px; color: #6b766f; }
  .notes { width: 290px; font-size: 13px; line-height: 1.55; color: #5e6a61; padding-top: 18px; }
  body.darkpage .notes { color: #9aa69f; } body.darkpage .notes h2, body.darkpage .notes b { color: #fff; }
  .notes h2 { font-size: 20px; color: #18201a; margin: 0 0 2px; letter-spacing: -0.02em; }
  .notes .tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1f6a53; }
  .notes ul { padding-left: 16px; margin: 10px 0; } .notes li { margin-bottom: 6px; } .notes b { color: #18201a; }
  .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 999; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 13px; }
  .switcher button { width: 34px; height: 34px; border-radius: 999px; color: #fff; font-size: 16px; text-align: center; }
  .switcher button:hover { background: #2a2a2a; }
  .switcher .slbl { min-width: 170px; text-align: center; font-weight: 600; } .switcher .slbl span { opacity: .55; font-weight: 500; }
  .switcher .sep { width: 1px; height: 22px; background: #333; margin: 0 2px; }
  .dots { display: flex; gap: 4px; justify-content: center; margin-top: 2px; } .dots i { width: 5px; height: 5px; border-radius: 9px; background: #555; } .dots i.on { background: #fff; }

  /* ================= themes ================= */
  .screen { position: relative; width: 100%; height: 100%; border-radius: 35px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--tx); }
  .dark {
    --bg: #0b0f0d; --card: #121815; --card2: #161d1a; --line: #1c2420; --line2: #26302b;
    --tx: #cfd8d2; --hi: #ffffff; --mu: #7d8f85; --fa: #56655d;
    --acc: #2fd18d; --on-acc: #06110c; --acc-soft: #143326;
    --good: #2fd18d; --bad: #ff7a6b; --warn: #f2b544; --info: #6cb6ff;
    --bad-soft: #211312; --bad-line: #42201d; --warn-soft: #1f1712; --warn-line: #3a2a19; --good-soft: #10241b;
    --hero: linear-gradient(135deg, #12251c, #0f1714); --hero-line: #1d3a2c;
    --dock: rgba(22,28,25,.86); --dock-line: #263029; --shadow: 0 10px 30px rgba(0,0,0,.5);
    --sb: #fff; --track: #1b2420;
  }
  .light {
    --bg: #f3f5f2; --card: #ffffff; --card2: #f7f8f6; --line: #e3e8e2; --line2: #d5dcd4;
    --tx: #2b342d; --hi: #111813; --mu: #66736b; --fa: #97a29a;
    --acc: #1f6a53; --on-acc: #ffffff; --acc-soft: #e3f1ea;
    --good: #1e7a56; --bad: #c2453a; --warn: #a86f0c; --info: #2e5e88;
    --bad-soft: #fcecea; --bad-line: #f3cfca; --warn-soft: #fbf3e2; --warn-line: #efdcae; --good-soft: #e6f3ec;
    --hero: linear-gradient(135deg, #e4f2ea, #f6faf7); --hero-line: #cfe5d8;
    --dock: rgba(255,255,255,.88); --dock-line: #e1e6df; --shadow: 0 10px 30px rgba(24,32,26,.14);
    --sb: #111; --track: #e8ece7;
  }
  .light .card { box-shadow: 0 1px 2px rgba(24,32,26,.04); }

  .statusbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0; font-size: 14px; font-weight: 600; color: var(--sb); }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 100px; }
  .scroll::-webkit-scrollbar { display: none; }

  /* shared kit */
  .hi { color: var(--hi); } .mu { color: var(--mu); } .good { color: var(--good) !important; } .bad { color: var(--bad) !important; } .warn { color: var(--warn) !important; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .hdr { padding: 2px 16px 12px; display: flex; align-items: center; gap: 8px; }
  .stbtn { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .stbtn .lg { width: 24px; height: 24px; border-radius: 7px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-weight: 800; font-size: 11px; }
  .stbtn .nm { font-size: 13px; font-weight: 600; color: var(--hi); }
  .pgt { font-size: 22px; font-weight: 800; color: var(--hi); letter-spacing: -0.03em; }
  .dt { margin-left: auto; font-size: 12px; color: var(--mu); display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .iconbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--mu); }
  .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fa); padding: 18px 16px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .lbl .r { color: var(--acc); letter-spacing: .02em; text-transform: none; font-weight: 600; font-size: 11px; }
  .k { font-size: 11px; color: var(--mu); font-weight: 500; }
  .s { font-size: 11px; color: var(--mu); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
  .cell { padding: 12px; }
  .cell .v { font-size: 20px; color: var(--hi); font-weight: 600; margin-top: 4px; }
  .cell.wide { grid-column: span 2; display: flex; align-items: flex-end; justify-content: space-between; }
  .cell.wide .v { font-size: 30px; letter-spacing: -0.03em; }
  .strip { margin: 0 12px; padding: 12px 14px; border-radius: 16px; background: var(--hero); border: 1px solid var(--hero-line); display: flex; align-items: center; gap: 12px; }
  .pulse { width: 10px; height: 10px; border-radius: 9px; background: var(--acc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 20%, transparent); flex-shrink: 0; }
  .dark .pulse { box-shadow: 0 0 0 4px rgba(47,209,141,.18), 0 0 14px var(--acc); }
  .strip .t { font-size: 14px; font-weight: 700; color: var(--hi); } .strip .m { font-size: 12px; color: var(--mu); }
  .strip .clock { margin-left: auto; text-align: right; } .strip .clock .v { font-size: 18px; color: var(--acc); font-weight: 600; }
  .strip .clock .m { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .alert { margin: 0 12px 8px; display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 14px; background: var(--warn-soft); border: 1px solid var(--warn-line); }
  .alert.red { background: var(--bad-soft); border-color: var(--bad-line); }
  .alert .t { font-size: 13px; font-weight: 600; color: var(--hi); } .alert .m { font-size: 11px; color: var(--mu); }
  .alert .go { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--warn); padding: 6px 10px; border-radius: 9px; background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .alert.red .go { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .badge { font-size: 10.5px; font-weight: 700; padding: 4px 8px; border-radius: 99px; white-space: nowrap; }
  .b-ok { background: var(--good-soft); color: var(--good); } .b-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
  .b-bad { background: var(--bad-soft); color: var(--bad); } .b-mu { background: var(--card2); color: var(--mu); border: 1px solid var(--line); }
  .list { margin: 0 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .t { font-size: 13px; color: var(--hi); font-weight: 600; } .row .m { font-size: 11px; color: var(--mu); }
  .row .end { margin-left: auto; text-align: right; }
  .row .v { font-size: 13.5px; font-weight: 600; color: var(--hi); }
  .chip { width: 32px; height: 32px; border-radius: 9px; background: var(--card2); border: 1px solid var(--line); color: var(--mu); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
  .seg { margin: 0 12px; display: grid; padding: 3px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .seg button { text-align: center; padding: 7px 0; border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--mu); }
  .seg button.on { background: var(--acc); color: var(--on-acc); }
  .tanks { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 12px; }
  .tank { padding: 10px; display: flex; gap: 10px; align-items: stretch; }
  .tube { width: 16px; height: 74px; border-radius: 6px; background: var(--track); position: relative; overflow: hidden; flex-shrink: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; }
  .tank .n { font-size: 12px; font-weight: 700; color: var(--hi); } .tank .p { font-size: 18px; margin-top: 6px; font-weight: 600; }
  .tank .c { font-size: 10px; color: var(--mu); margin-top: 2px; line-height: 1.35; }
  .bar { height: 6px; border-radius: 9px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; }
  .hatch { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--acc) 35%, transparent) 0 4px, transparent 4px 8px); }
  .daystrip { display: flex; gap: 6px; padding: 0 12px; }
  .daystrip button { flex: 1; padding: 7px 0 8px; border-radius: 12px; text-align: center; border: 1px solid var(--line); background: var(--card); }
  .daystrip .w { font-size: 9.5px; font-weight: 700; text-transform: uppercase; color: var(--fa); letter-spacing: .05em; }
  .daystrip .d { font-size: 15px; font-weight: 700; color: var(--hi); margin-top: 1px; }
  .daystrip .dot { width: 5px; height: 5px; border-radius: 9px; margin: 4px auto 0; }
  .daystrip button.on { background: var(--acc); border-color: var(--acc); } .daystrip button.on .w, .daystrip button.on .d { color: var(--on-acc); }
  .search { margin: 0 12px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--mu); font-size: 13px; }
  .tbl { width: 100%; font-size: 12px; }
  .tbl .tr { display: grid; grid-template-columns: 1.1fr 1fr .9fr 1.2fr; padding: 10px 12px; border-top: 1px solid var(--line); align-items: baseline; }
  .tbl .tr:first-child { border-top: 0; }
  .tbl .th { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fa); font-weight: 700; }
  .tbl .tr > :not(:first-child) { text-align: right; }
  .tbl .tot { background: var(--card2); border-radius: 0 0 14px 14px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 13px; font-size: 13.5px; font-weight: 700; }
  .btn.pri { background: var(--acc); color: var(--on-acc); } .btn.sec { background: var(--card); border: 1px solid var(--line); color: var(--hi); }
  .dock { z-index: 10; position: absolute; left: 14px; right: 14px; bottom: 22px; display: flex; justify-content: space-around; padding: 7px; border-radius: 22px; background: var(--dock); backdrop-filter: blur(16px); border: 1px solid var(--dock-line); box-shadow: var(--shadow); }
  .dock button { width: 54px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--fa); position: relative; }
  .dock button.on { background: var(--acc); color: var(--on-acc); }
  .pip { position: absolute; top: 8px; right: 12px; width: 7px; height: 7px; border-radius: 9px; background: var(--bad); border: 2px solid var(--card); }
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 110px; padding: 0 2px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .chart .b { width: 100%; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--acc) 35%, transparent); }
  .chart .b.on { background: var(--acc); }
  .chart .x { font-size: 9.5px; color: var(--fa); }
  .av { width: 30px; height: 30px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-size: 11px; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; }
  .prog { display: flex; gap: 4px; } .prog i { flex: 1; height: 5px; border-radius: 9px; background: var(--track); } .prog i.on { background: var(--acc); }
  /* --- round 3 additions --- */
  .back { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--hi); flex-shrink: 0; }
  .dethdr { padding: 4px 14px 12px; display: flex; align-items: center; gap: 10px; }
  .dethdr .tt { font-size: 17px; font-weight: 800; color: var(--hi); letter-spacing: -0.02em; }
  .dethdr .st { font-size: 11.5px; color: var(--mu); margin-top: 1px; }
  .actionbar { z-index: 10; position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px 26px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; background: var(--dock); backdrop-filter: blur(16px); border-top: 1px solid var(--dock-line); }
  .stack { display: flex; height: 10px; gap: 2px; border-radius: 9px; overflow: hidden; }
  .prow { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  .prow:first-child { border-top: 0; }
  .prow .sw { width: 10px; height: 10px; border-radius: 3px; }
  .prow .n { font-size: 13px; font-weight: 600; color: var(--hi); }
  .prow .q { font-size: 11.5px; color: var(--mu); text-align: right; }
  .prow .v { font-size: 13.5px; font-weight: 600; color: var(--hi); text-align: right; min-width: 78px; }
  .subhd { padding: 10px 12px 6px; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fa); display: flex; justify-content: space-between; border-top: 1px solid var(--line); background: var(--card2); }
  .subhd .live { color: var(--acc); letter-spacing: .02em; text-transform: none; }
  .nz { display: grid; grid-template-columns: 1.15fr 1.25fr 1.25fr .8fr; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 11.5px; align-items: baseline; }
  .nz:first-child { border-top: 0; }
  .nz > :not(:first-child) { text-align: right; }
  .nz.th { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--fa); font-weight: 700; }
  .dayrow { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-top: 1px solid var(--line); }
  .dayrow:first-child { border-top: 0; }
  .dayrow .dd { width: 40px; text-align: center; flex-shrink: 0; }
  .dayrow .dd .w { font-size: 9.5px; font-weight: 700; color: var(--fa); text-transform: uppercase; letter-spacing: .06em; }
  .dayrow .dd .d { font-size: 19px; font-weight: 800; color: var(--hi); line-height: 1.1; }
  .chev { color: var(--fa); margin-left: 2px; flex-shrink: 0; }
  [data-go] { cursor: pointer; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 26px 26px 0 0; padding: 8px 0 30px; border-top: 1px solid var(--line); max-height: 88%; overflow-y: auto; scrollbar-width: none; }
  .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--line2); margin: 2px auto 12px; }
  .opt { display: grid; grid-template-columns: repeat(3,1fr); padding: 3px; border-radius: 11px; background: var(--card2); border: 1px solid var(--line); }
  .opt button { text-align: center; padding: 6px 0; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--mu); }
  .opt button.on { background: var(--card); color: var(--hi); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .diverge { position: relative; height: 8px; border-radius: 9px; background: var(--track); }
  .diverge::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line2); }
  .diverge i { position: absolute; top: 0; bottom: 0; border-radius: 9px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; }
  .duo > div { padding: 12px; } .duo > div + div { border-left: 1px solid var(--line); }
  .moved { margin: 16px 12px 0; padding: 12px; border-radius: 14px; border: 1px dashed var(--line2); font-size: 11.5px; color: var(--mu); line-height: 1.5; }
  /* --- handover --- */
  .pin { margin: 0 12px 10px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--acc); color: var(--on-acc); }
  .pin .t { font-size: 14px; font-weight: 800; } .pin .m { font-size: 11.5px; opacity: .8; font-weight: 600; }
  .pin .go { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 7px 10px; border-radius: 10px; background: color-mix(in srgb, var(--on-acc) 14%, transparent); }
  .sum { position: sticky; top: 0; z-index: 5; margin: 0 12px; padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1fr; box-shadow: 0 8px 16px -12px rgba(0,0,0,.4); }
  .sum > div + div { border-left: 1px solid var(--line); padding-left: 10px; }
  .sum .k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--fa); }
  .sum .v { font-size: 15px; font-weight: 600; color: var(--hi); margin-top: 2px; }
  details.step { margin: 8px 12px 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  details.step > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; }
  details.step > summary::-webkit-details-marker { display: none; }
  .stepn { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card2); border: 1px solid var(--line); color: var(--mu); flex-shrink: 0; }
  .stepn.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
  details.step .st { font-size: 13.5px; font-weight: 700; color: var(--hi); } details.step .sm { font-size: 11px; color: var(--mu); }
  details.step .tw { margin-left: auto; color: var(--fa); transition: transform .15s; }
  details.step[open] .tw { transform: rotate(90deg); }
  .stepbody { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld .fl { font-size: 11.5px; font-weight: 600; color: var(--mu); display: flex; justify-content: space-between; }
  .inp { height: 46px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); display: flex; align-items: center; padding: 0 12px; gap: 8px; font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--hi); }
  .inp.focus { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 20%, transparent); }
  .inp .pre { color: var(--fa); font-size: 14px; } .inp .suf { margin-left: auto; font-family: var(--font-sans); font-size: 12px; color: var(--mu); font-weight: 600; }
  .fh { font-size: 11px; color: var(--mu); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); }
  .slip .t { font-size: 13px; font-weight: 600; color: var(--hi); } .slip .m { font-size: 11px; color: var(--mu); }

<script>
/* ---------------- mock data (one consistent day) ---------------- */
const D = {
  // Today, Fri 9 Oct. Fuel = closed shifts only (Shift 1). Product sales are
  // entered live, so they include the running Shift 2.
  fuel: [ { k: 'MS', name: 'Petrol', l: 1060, v: 109095, c: 'var(--acc)' },
          { k: 'HSD', name: 'Diesel', l: 1120, v: 100330, c: 'var(--info)' },
          { k: 'XP95', name: 'Premium', l: 31, v: 3455, c: 'var(--warn)' } ],
  other: [ { k: 'Lubricants', q: '14 units', v: 4920 }, { k: 'Additives', q: '6 units', v: 1140 }, { k: 'Accessories', q: '3 units', v: 780 } ],
  trend: [402, 455, 431, 470, 512, 441, 485],
  credit: 27520, purchases: 1043200, variance: -340, margin: 21450,
  receivables: 682400, payables: 1043200,
  tanks: [ { k: 'MS', pct: 62, kl: '12.4 KL', days: '2.6 days' }, { k: 'HSD', pct: 18, kl: '3.6 KL', days: '0.9 day' }, { k: 'XP95', pct: 74, kl: '7.4 KL', days: '9 days' } ],
  dus: [ { id: 'DU1', who: 'Ramesh K', st: 'Selling', drops: 0 }, { id: 'DU2', who: 'Sajid P', st: 'Recorded', drops: 20000 }, { id: 'DU3', who: 'Vinod M', st: 'Handover due', drops: 10000 } ],
};
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
D.fuelV = sum(D.fuel, f => f.v); D.fuelL = sum(D.fuel, f => f.l); D.otherV = sum(D.other, o => o.v);
const inr = (n, c) => { const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (c && a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2).replace(/\.?0+$/, '') + 'L';
  if (c && a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return s + '₹' + a.toLocaleString('en-IN'); };
const L = (n) => n.toLocaleString('en-IN') + ' L';
const ic = (p, s = 20, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  pump: '<path d="M4 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16"/><path d="M3 21h11"/><path d="M7 8h3"/><path d="M13 10h3l3 3v5a1.5 1.5 0 0 1-3 0v-4h-3"/>',
  doc: '<path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v5h5"/><path d="M8 13h8M8 17h5"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/>',
  bars: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M3 20h18"/>',
  down: '<path d="m6 9 6 6 6-6"/>', chev: '<path d="m9 6 6 6-6 6"/>', left: '<path d="m15 6-6 6 6 6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  share: '<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  dl: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  check: '<path d="m5 12 5 5L20 7"/>', building: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
  truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
};
const statusbar = () => `<div class="statusbar"><span>5:12</span><span class="icons">
  <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
  <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor"/></svg></span></div>`;
const spark = (vals, w, h, p = 3) => { const mx = Math.max(...vals), mn = Math.min(...vals);
  return vals.map((v, i) => (i ? 'L' : 'M') + ((i / (vals.length - 1)) * w).toFixed(1) + ' ' + (h - p - ((v - mn) / (mx - mn || 1)) * (h - p * 2)).toFixed(1)).join(' '); };
const tc = (p) => p < 25 ? 'var(--bad)' : p < 40 ? 'var(--warn)' : 'var(--good)';
const chev = `<span class="chev">${ic(I.chev, 16, 2.2)}</span>`;
const vbadge = (v) => v === 0 ? '<span class="badge b-ok">Balanced</span>' : `<span class="badge ${v < 0 ? 'b-bad' : 'b-warn'} num">${v > 0 ? '+' : ''}${inr(v)}</span>`;

const TABS = [['home', I.home], ['shifts', I.pump], ['reports', I.doc], ['money', I.wallet], ['insights', I.bars]];
const dock = (active) => `<nav class="dock">${TABS.map(([k, p]) =>
  `<button data-go="${k}" class="${k === active ? 'on' : ''}" aria-label="${k}">${ic(p, 21, 2)}</button>`).join('')}</nav>`;
const actionbar = (what) => `<div class="actionbar"><button class="btn sec">${ic(I.share, 16)} Share</button><button class="btn pri">${ic(I.dl, 16, 2.2)} Download ${what}</button></div>`;
const topRight = `<button class="iconbtn" data-go="alerts" style="position:relative" aria-label="Alerts">${ic(I.bell, 17)}<span class="pip" style="top:6px;right:7px"></span></button>
  <button data-go="account" class="av" style="width:34px;height:34px" aria-label="Account">AN</button>`;
const stHdr = () => `<div class="hdr"><button class="stbtn" data-go="account"><div class="lg">HF</div><div class="nm">Highway Fuels</div><span style="color:var(--fa)">${ic(I.down, 14, 2.4)}</span></button><div style="flex:1"></div>${topRight}</div>`;
const pageHdr = (title, right = '') => `<div class="hdr" style="padding-top:6px"><div><div class="s" style="font-weight:600">Highway Fuels</div><div class="pgt">${title}</div></div><div style="margin-left:auto;display:flex;gap:8px">${right}</div></div>`;
const detHdr = (back, title, sub, right = '') => `<div class="dethdr"><button class="back" data-go="${back}" aria-label="Back">${ic(I.left, 18, 2.2)}</button>
  <div style="min-width:0;flex:1"><div class="tt">${title}</div><div class="st">${sub}</div></div>${right}</div>`;

/* Sales-by-product card, reused by Home, Shift summary and DSSR. */
function productCard({ fuel, other, fuelNote, otherNote }) {
  const fv = sum(fuel, f => f.v), ov = sum(other, o => o.v), tot = fv + ov;
  return `<div class="card" style="margin:0 12px;overflow:hidden">
    <div style="padding:12px 12px 10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="k">Total sales</span><span class="num hi" style="font-size:17px;font-weight:600">${inr(tot)}</span></div>
      <div class="stack" style="margin-top:10px">${fuel.map(f => `<div style="flex:${f.v};background:${f.c}"></div>`).join('')}<div style="flex:${Math.max(ov, tot * .012)};background:var(--mu)"></div></div>
    </div>
    <div class="subhd"><span>Fuel</span><span class="${fuelNote.live ? 'live' : ''}">${fuelNote.text}</span></div>
    ${fuel.map(f => `<div class="prow"><span class="sw" style="background:${f.c}"></span><div><div class="n">${f.name} <span class="mu" style="font-weight:500">· ${f.k}</span></div></div><span class="q num">${L(f.l)}</span><span class="v num">${inr(f.v)}</span></div>`).join('')}

    ${other.map(o => `<div class="prow"><span class="sw" style="background:var(--mu);opacity:.6"></span><div class="n">${o.k}</div><span class="q">${o.q}</span><span class="v num">${inr(o.v)}</span></div>`).join('')}
    <div class="prow" style="background:var(--card2)"><span></span><div class="n">Products total</div><span class="q">${other.reduce((s, o) => s + parseInt(o.q), 0)} units</span><span class="v num">${inr(ov)}</span></div>
  </div>`;
}

/* ================= HOME ================= */
function Home(assigned) {

  return `${stHdr()}${assigned ? pinCard() : ''}

    <div class="grid2">

        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div><div class="k">Sales so far today</div><div class="v num">${inr(total)}</div><div class="s num">${L(D.fuelL)} fuel · ${inr(D.otherV)} products</div></div>
          <svg width="84" height="40" viewBox="0 0 84 40"><path d="${spark(D.trend, 84, 40)}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg>

    <div class="tanks">${D.tanks.map(t => `<div class="card tank"><div class="tube"><i style="height:${t.pct}%;background:${tc(t.pct)}"></i></div>
      <div><div class="n">${t.k}</div><div class="p num" style="color:${tc(t.pct)}">${t.pct}%</div><div class="c">${t.kl}<br/>${t.days}</div></div></div>`).join('')}</div>

}

/* ================= SHIFTS ================= */
function Shifts() {

    ${past.map(([day, rows]) => `<div class="lbl"><span>${day}</span><span class="r num">${inr(rows.reduce((s, r) => s + r[2], 0), true)}</span></div>

/* ================= REPORTS (day list) ================= */

const PAGES = Object.keys(META);

/* ---------------- shell ---------------- */
const params = new URLSearchParams(location.search);
if (params.get('tall')) document.head.insertAdjacentHTML('beforeend', '<style>.phone{height:auto}.screen{height:auto}.scroll{overflow:visible}</style>');
let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
let page = PAGES.includes(params.get('page')) ? params.get('page') : 'home';
const screen = (p) => { const m = META[p];
  const bottom = m.bar ? m.bar() : m.detail ? actionbar(m.detail) : (m.noDock || m.render === Alerts) ? '' : dock(m.tab);
  return `<div class="phone"><div class="screen ${theme}">${statusbar()}<div class="scroll">${m.render()}</div>${bottom}${m.sheet ? AccountSheet() : ''}${m.overlay ? m.overlay() : ''}</div></div>`; };
function render() {
  document.body.classList.toggle('darkpage', theme === 'dark');
  if (params.get('page') === 'all') {
    document.querySelector('.switcher').style.display = 'none';
    const only = (params.get('only') || '').split(',').filter(Boolean);
    document.getElementById('stage').innerHTML = (only.length ? only : PAGES).map(p => `<div><div class="cap">${META[p].name} · ${theme}</div>${screen(p)}</div>`).join('');
  } else {
    document.getElementById('stage').innerHTML = `${screen(page)}<div class="notes">${META[page].notes}</div>`;
  }
  document.getElementById('lbl').innerHTML = `${META[page].name} <span>· ${theme}</span>`;
  document.getElementById('dots').innerHTML = PAGES.map(p => `<i class="${p === page ? 'on' : ''}"></i>`).join('');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = (e) => { e.stopPropagation(); page = b.dataset.go; sync(); });
}
function sync() { try { const u = new URL(location.href); if (u.searchParams.get('page') !== 'all') u.searchParams.set('page', page); u.searchParams.set('theme', theme); history.replaceState(null, '', u); } catch (e) {} render(); }
const go = (d) => { page = PAGES[(PAGES.indexOf(page) + d + PAGES.length) % PAGES.length]; sync(); };
const flip = () => { theme = theme === 'dark' ? 'light' : 'dark'; sync(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('theme').onclick = flip;
addEventListener('keydown', (e) => { const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); if (e.key === 't') flip(); });
render();
</script>
</body>
</html>
