<script>
const D = {
  sales: 484528, volume: 5050, deltaPct: 9.8,
  mix: [ { k: 'Cash', v: 231400, c: '#3ddc97' }, { k: 'UPI', v: 142300, c: '#2aa877' }, { k: 'Card', v: 57800, c: '#5ab4ff' }, { k: 'Credit', v: 53028, c: '#f5b74a' } ],
  fuels: [ { k: 'MS', l: 2410, v: 248037 }, { k: 'HSD', l: 2640, v: 236491 } ],
  trend: [402, 455, 431, 470, 512, 441, 485],
  credit: 53028, purchases: 1043200, variance: -340, margin: 21450, products: 6840,
  receivables: 682400, payables: 1043200, overdue: 4, pace: 712000, typical: 650000,
  tanks: [ { k: 'MS', pct: 62, kl: '12.4 KL', days: '2.6 d' }, { k: 'HSD', pct: 18, kl: '3.6 KL', days: '0.9 d' }, { k: 'XP95', pct: 74, kl: '7.4 KL', days: '9 d' } ],
  dus: [ { id: 'DU1', who: 'Ramesh K', ini: 'RK', noz: ['MS', 'MS', 'HSD'], drops: 0, due: false },
         { id: 'DU2', who: 'Sajid P', ini: 'SP', noz: ['MS', 'HSD', 'HSD'], drops: 20000, due: false },
         { id: 'DU3', who: 'Vinod M', ini: 'VM', noz: ['XP95', 'HSD'], drops: 10000, due: true } ],
};
const inr = (n, c) => { const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (c && a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2).replace(/\.?0+$/, '') + 'L';
  if (c && a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return s + '₹' + a.toLocaleString('en-IN'); };
const L = (n) => n.toLocaleString('en-IN') + ' L';
const ic = (p, s = 20, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  pump: '<path d="M4 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16"/><path d="M3 21h11"/><path d="M7 8h3"/><path d="M13 10h3l3 3v5a1.5 1.5 0 0 1-3 0v-4h-3"/>',
  doc: '<path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v5h5"/><path d="M8 13h8M8 17h5"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/>',
  bars: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M3 20h18"/>',
  down: '<path d="m6 9 6 6 6-6"/>', chev: '<path d="m9 6 6 6-6 6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
};
const statusbar = () => `<div class="statusbar"><span>5:12</span><span class="icons">
  <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
  <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor"/></svg></span></div>`;
const spark = (vals, w, h, p = 3) => { const mx = Math.max(...vals), mn = Math.min(...vals);
  return vals.map((v, i) => (i ? 'L' : 'M') + ((i / (vals.length - 1)) * w).toFixed(1) + ' ' + (h - p - ((v - mn) / (mx - mn || 1)) * (h - p * 2)).toFixed(1)).join(' '); };
const tc = (p) => p < 25 ? '#ff7a6b' : p < 40 ? '#f5b74a' : '#3ddc97';

/* donut for payment mix */
function donut(size, stroke) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, tot = D.mix.reduce((s, m) => s + m.v, 0); let off = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    ${D.mix.map(m => { const len = (m.v / tot) * C - 2; const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${m.c}" stroke-width="${stroke}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`; off += (m.v / tot) * C; return el; }).join('')}</svg>`;
}

/* ================= B3 — Instrument ================= */
function B3() {
  // 240° arc gauge: sales so far vs pace projection
  const W = 260, R = 100, cx = 130, cy = 122, a0 = 150, sweep = 240;
  const pt = (a) => [cx + R * Math.cos(a * Math.PI / 180), cy + R * Math.sin(a * Math.PI / 180)];
  const arc = (from, to) => { const [x1, y1] = pt(from), [x2, y2] = pt(to); return `M${x1} ${y1} A${R} ${R} 0 ${to - from > 180 ? 1 : 0} 1 ${x2} ${y2}`; };
  const max = 800000, frac = D.sales / max, typ = D.typical / max, pace = D.pace / max;
  const [tx, ty] = pt(a0 + sweep * typ);
  const [px, py] = pt(a0 + sweep * pace);
  const ticks = Array.from({ length: 25 }, (_, i) => { const a = (a0 + (sweep / 24) * i) * Math.PI / 180, r1 = R + 12, r2 = R + (i % 6 === 0 ? 20 : 16);
    return `<line x1="${cx + r1 * Math.cos(a)}" y1="${cy + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cy + r2 * Math.sin(a)}" stroke="${i % 6 === 0 ? '#5a554a' : '#2f2c26'}" stroke-width="1.5"/>`; }).join('');
  const dial = (t) => { const r = 26, C = 2 * Math.PI * r * 0.75; return `<svg width="64" height="56" viewBox="0 0 64 64">
    <circle cx="32" cy="34" r="${r}" fill="none" stroke="#26241f" stroke-width="6" stroke-dasharray="${C} 999" transform="rotate(135 32 34)" stroke-linecap="round"/>
    <circle cx="32" cy="34" r="${r}" fill="none" stroke="${tc(t.pct)}" stroke-width="6" stroke-dasharray="${C * t.pct / 100} 999" transform="rotate(135 32 34)" stroke-linecap="round"/>
    <text x="32" y="39" text-anchor="middle" fill="#fff" font-family="Geist Mono" font-size="13" font-weight="600">${t.pct}%</text></svg>`; };
  return `<div class="screen dk B3">${statusbar()}<div class="scroll">
    <div class="top">
      <div><button class="st">Highway Fuels ${ic(I.down, 14, 2.4)}</button><div class="sh"><span class="pulse"></span>Shift 2 · 3h 12m · Fri 9 Oct</div></div>
      <div style="display:flex;gap:8px"><button class="iconbtn">${ic(I.cal, 17)}</button><button class="iconbtn">${ic(I.bell, 17)}<span class="pip" style="top:7px;right:8px"></span></button></div>
    </div>
    <div class="gauge">
      <svg width="${W}" height="200" viewBox="0 0 ${W} 200" style="position:absolute;top:0;left:0;overflow:visible">
        <defs><linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffcf5c"/></linearGradient></defs>
        ${ticks}
        <path d="${arc(a0, a0 + sweep)}" fill="none" stroke="#1f1d19" stroke-width="14" stroke-linecap="round"/>
        <path d="${arc(a0, a0 + sweep * frac)}" fill="none" stroke="url(#g3)" stroke-width="14" stroke-linecap="round" style="filter:drop-shadow(0 0 8px rgba(255,181,71,.35))"/>
        <path d="${arc(a0 + sweep * frac, a0 + sweep * pace)}" fill="none" stroke="#ffb547" stroke-opacity=".28" stroke-width="14" stroke-dasharray="2 4"/>
        <circle cx="${tx}" cy="${ty}" r="4" fill="#0d0d0c" stroke="#9a9384" stroke-width="2"/>
      </svg>
      <div class="c"><div class="k">Fuel sales today</div><div class="v num">${inr(D.sales)}</div><div class="k num">${L(D.volume)} · <span class="good">▲ 9.8%</span></div></div>
    </div>
    
    <div class="pace"><span class="chip">On pace for <b class="num">${inr(D.pace, true)}</b></span><span class="chip">Typical Fri <b class="num">${inr(D.typical, true)}</b></span></div>

    <div class="tabs"><button class="on">Stock</button><button>Cash</button><button>Money</button><button>Alerts<span class="ct">3</span></button></div>
    <div class="dials">${D.tanks.map(t => `<div class="card dial">${dial(t)}<div class="n">${t.k}</div><div class="d num">${t.kl}<br/>${t.days} cover</div></div>`).join('')}</div>
    <button class="cta">${ic(I.truck, 20, 2.2)}<div><div class="t">Order diesel</div><div class="m">HSD runs out ~Sat 4 am at current pace</div></div><span style="margin-left:auto">${ic(I.arrow, 18, 2.4)}</span></button>
    <div class="card rows">
      <div class="r"><span class="ic">${ic(I.drop, 15)}</span><span class="t">Sold today</span><span class="v num">${L(D.volume)}</span></div>
      <div class="r"><span class="ic">${ic(I.truck, 15)}</span><span class="t">Received · HSD tanker</span><span class="v num">12,000 L</span></div>
      <div class="r"><span class="ic">${ic(I.cash, 15)}</span><span class="t">Gross margin</span><span class="v num good">${inr(D.margin)}</span></div>
      <div class="r"><span class="ic">${ic(I.lock, 15)}</span><span class="t">Cash variance</span><span class="v num bad">${inr(D.variance)}</span></div>
    </div>
  </div>${dock(4)}</div>`;
}

const VARIANTS = [
  { key: 'B1', name: 'Bento+', render: B1, notes: `<div class="tag">B1</div><h2>Bento+</h2>
    <p>The original B, refined. Same mint accent, tighter hierarchy.</p>
    <ul><li>A <b>scope switch</b> (Shift 2 · Today · 7 days) re-scopes every number on the screen.</li>
    <li>The hero shows the live shift with attendant avatars and a <b>payment-mix donut</b>.</li>
    <li>A mixed-size bento: the important tiles are bigger, minor ones are thirds.</li>
    <li>Tanks become <b>horizontal bars with days of cover</b>, which are quicker to compare than tubes.</li>
    <li>Date and alerts move to header icons, so the date pill is gone.</li></ul>` },
  { key: 'B2', name: 'Forecourt', render: B2, notes: `<div class="tag">B2</div><h2>Forecourt</h2>
    <p>A spatial layout. The Home <b>looks like the station</b>, in a diesel-blue accent.</p>
    <ul><li>A <b>forecourt card</b> shows the DU islands (attendant, nozzles, drops, handover state) above the underground tanks.</li>
    <li>Tapping an island opens that DU's drawer.</li>
    <li>The top alert is a ticker that cycles through 1 / 3.</li>
    <li>KPI cards scroll sideways, and the payment mix shows as relative bars.</li>
    <li>Good for stations with many DUs. Needs a sensible layout for 6+ islands.</li></ul>` },
  { key: 'B3', name: 'Instrument', render: B3, notes: `<div class="tag">B3</div><h2>Instrument</h2>
    <p>A car-dashboard feel in graphite with an amber accent.</p>
    <ul><li>A <b>gauge</b> shows sales so far against a projection for the full day. The dotted arc is the projection and the marker is a typical Friday.</li>
    <li>"On pace for ₹7.12L" is a <b>new derived insight</b>, projected from past days' hourly curves.</li>
    <li>Tabs (Stock / Cash / Money / Alerts) replace one long scroll.</li>
    <li>Tank dials plus a <b>predictive CTA</b>: "HSD runs out ~Sat 4 am".</li>
    <li>The most distinctive of the three, but the pace and run-out figures need new calculations.</li></ul>` },
];
const params = new URLSearchParams(location.search);
if (params.get('tall')) document.head.insertAdjacentHTML('beforeend', '<style>.phone{height:auto}.screen{height:auto}.scroll{overflow:visible}</style>');
let idx = Math.max(0, VARIANTS.findIndex(v => v.key === (params.get('variant') || 'B1').toUpperCase()));
function render() {
  if (params.get('variant') === 'all' || innerWidth >= 1250) {
    document.getElementById('stage').innerHTML = VARIANTS.map(x => `<div><div style="font:700 13px var(--font-sans);margin:0 0 10px 6px;color:#5e6a61">${x.key} · ${x.name}</div><div class="phone">${x.render()}</div></div>`).join('');
    document.querySelector('.switcher').style.display = 'none'; return;
  }
  const v = VARIANTS[idx];
  document.getElementById('stage').innerHTML = `<div class="phone">${v.render()}</div><div class="notes">${v.notes}</div>`;
  document.getElementById('lbl').innerHTML = `${v.key} <span>(${v.name})</span>`;
  document.getElementById('dots').innerHTML = VARIANTS.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('');
  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); history.replaceState(null, '', u); } catch (e) {}
}
const go = (d) => { idx = (idx + d + VARIANTS.length) % VARIANTS.length; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', (e) => { const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
render();
</script>
