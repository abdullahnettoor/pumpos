<!doctype html>
<!--
  PROTOTYPE — throwaway. Not wired to the app.
  Question: "What should the mobile Owner Home + shell look like?"
  Three radically different variants of the Owner Home + shell, same mock data.
  Switch with the floating bar, ←/→ keys, or ?variant=A|B|C. Open by double-click.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PumpOS mobile — Home variants (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
    /* PumpOS tokens */
    --bg-canvas: #f6f7f4; --bg-surface: #fff; --bg-surface-alt: #f1f3ef;
    --border-soft: #e3e7e0; --border-strong: #b9c1b7;
    --text-strong: #18201a; --text-default: #2b342d; --text-muted: #5e6a61; --text-faint: #8a948b;
    --brand: #1f6a53; --brand-2: #2e5e88; --amber: #b7811e; --red: #b44a3f;
    --ok-bg: #e8f4ee; --ok-fg: #1e6a4e; --warn-bg: #f9f0da; --warn-fg: #8a6116;
    --bad-bg: #f8e3e0; --bad-fg: #9f3f36; --info-bg: #e8f0f7; --info-fg: #2e5e88;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; font-family: var(--font-sans); color: var(--text-default); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; letter-spacing: -0.01em; }

  /* ---------- stage ---------- */
  .stage { display: flex; gap: 28px; align-items: flex-start; justify-content: center; padding: 8px 0 90px; flex-wrap: wrap; }
  .phone {
    width: 375px; height: 780px; border-radius: 44px; padding: 10px;
    background: #0e1210; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.2);
    flex-shrink: 0;
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 35px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0; font-size: 14px; font-weight: 600; }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #000; border-radius: 20px; z-index: 50; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .notes { width: 300px; font-size: 13px; line-height: 1.55; color: var(--text-muted); padding-top: 18px; }
  .notes h2 { font-size: 20px; color: var(--text-strong); margin: 0 0 2px; letter-spacing: -0.02em; }
  .notes .tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
  .notes ul { padding-left: 16px; margin: 10px 0; }
  .notes li { margin-bottom: 6px; }
  .notes b { color: var(--text-strong); font-weight: 600; }

  /* ---------- switcher (not part of design) ---------- */
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 999;
    display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px;
    background: #111; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 13px;
  }
  .switcher button { width: 34px; height: 34px; border-radius: 999px; color: #fff; font-size: 16px; }
  .switcher button:hover { background: #2a2a2a; }
  .switcher .lbl { min-width: 210px; text-align: center; font-weight: 600; }
  .switcher .lbl span { opacity: .55; font-weight: 500; }
  .dots { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 9px; background: #555; }
  .dots i.on { background: #fff; }

  /* ================= VARIANT A — Briefing ================= */
  .A { background: var(--bg-canvas); color: var(--text-default); }
  .A .num, .C .num { font-family: var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .A .top { padding: 4px 18px 10px; display: flex; align-items: center; justify-content: space-between; }
  .A .ctx { display: flex; align-items: center; gap: 10px; text-align: left; }
  .A .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; color: #fff; }
  .A .ctx .st { font-size: 15px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; display: flex; gap: 4px; align-items: center; }
  .A .ctx .sub { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .A .live { width: 6px; height: 6px; border-radius: 9px; background: #2fa36f; box-shadow: 0 0 0 3px rgba(47,163,111,.18); }
  .A .avatar { width: 34px; height: 34px; border-radius: 99px; background: #dfe7e1; color: var(--brand); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .A .days { display: flex; gap: 4px; padding: 2px 14px 14px; }
  .A .day { flex: 1; min-width: 0; padding: 6px 0 7px; border-radius: 12px; text-align: center; background: transparent; border: 1px solid transparent; }
  .A .day .w { font-size: 10px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
  .A .day .d { font-size: 15px; font-weight: 700; color: var(--text-strong); margin-top: 1px; }
  .A .day .s { width: 5px; height: 5px; border-radius: 9px; margin: 4px auto 0; }
  .A .day.on { background: var(--text-strong); }
  .A .day.on .w { color: rgba(255,255,255,.6); } .A .day.on .d { color: #fff; }
  .A .hero { margin: 0 14px; padding: 18px 18px 14px; border-radius: 22px; background: var(--bg-surface); box-shadow: 0 1px 0 var(--border-soft), 0 8px 24px -16px rgba(24,32,26,.25); }
  .A .eyebrow { font-size: 12px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; }
  .A .big { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; color: var(--text-strong); margin: 4px 0 2px; line-height: 1.05; }
  .A .big small { font-size: 22px; font-weight: 700; color: var(--text-faint); }
  .A .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ok-fg); background: var(--ok-bg); padding: 3px 8px; border-radius: 99px; }
  .A .heromuted { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
  .A .mix { display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 16px 0 10px; }
  .A .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12px; }
  .A .legend div { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
  .A .legend b { margin-left: auto; color: var(--text-strong); font-weight: 600; }
  .A .legend i { width: 8px; height: 8px; border-radius: 3px; }
  .A .sect { padding: 22px 18px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .A .sect h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
  .A .sect a { font-size: 12px; font-weight: 600; color: var(--brand); }
  .A .att { margin: 0 14px; background: var(--bg-surface); border-radius: 18px; overflow: hidden; box-shadow: 0 1px 0 var(--border-soft); }
  .A .att .row { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-top: 1px solid var(--bg-surface-alt); text-align: left; width: 100%; }
  .A .att .row:first-child { border-top: 0; }
  .A .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
  .A .row .t { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .A .row .m { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .A .chev { margin-left: auto; color: var(--text-faint); }
  .A .stmt { margin: 0 14px; background: var(--bg-surface); border-radius: 18px; padding: 4px 16px; box-shadow: 0 1px 0 var(--border-soft); }
  .A .stmt .line { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px dashed var(--border-soft); font-size: 14px; }
  .A .stmt .line:first-child { border-top: 0; }
  .A .stmt .line span:first-child { color: var(--text-muted); }
  .A .stmt .line .v { font-weight: 600; color: var(--text-strong); font-size: 14px; }
  .A .stmt .line .v em { font-style: normal; font-size: 11px; color: var(--text-faint); margin-right: 6px; font-family: var(--font-sans); }
  .A .pos { margin: 0 14px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .A .pos > div { background: var(--bg-surface); border-radius: 18px; padding: 14px; box-shadow: 0 1px 0 var(--border-soft); }
  .A .pos .l { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .A .pos .v { font-size: 19px; font-weight: 700; color: var(--text-strong); margin-top: 4px; letter-spacing: -0.02em; }
  .A .pos .s { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .A .tab { flex-shrink: 0; display: grid; grid-template-columns: repeat(4,1fr); padding: 8px 10px 26px; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--border-soft); }
  .A .tab button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-faint); }
  .A .tab button.on { color: var(--text-strong); }
  .A .tab button.on svg { color: var(--brand); }

  /* ================= VARIANT B — Control room (dark) ================= */
  .B { background: #0b0f0d; color: #cfd8d2; }
  .B .statusbar { color: #fff; }
  .B .hdr { padding: 2px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .B .stbtn { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 12px; background: #151b18; border: 1px solid #222b26; }
  .B .stbtn .lg { width: 24px; height: 24px; border-radius: 7px; background: #2fd18d; color: #06110c; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .B .stbtn .nm { font-size: 13px; font-weight: 600; color: #fff; }
  .B .dt { margin-left: auto; font-size: 12px; color: #8fa197; display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 10px; border: 1px solid #222b26; }
  .B .strip { margin: 0 12px; padding: 12px 14px; border-radius: 16px; background: linear-gradient(135deg, #12251c, #0f1714); border: 1px solid #1d3a2c; display: flex; align-items: center; gap: 12px; }
  .B .pulse { width: 10px; height: 10px; border-radius: 9px; background: #2fd18d; box-shadow: 0 0 0 4px rgba(47,209,141,.18), 0 0 14px #2fd18d; }
  .B .strip .t { font-size: 14px; font-weight: 700; color: #fff; }
  .B .strip .m { font-size: 12px; color: #8fa197; }
  .B .strip .clock { margin-left: auto; text-align: right; }
  .B .strip .clock .v { font-size: 18px; color: #2fd18d; font-weight: 600; }
  .B .strip .clock .m { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .B .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #64756b; padding: 18px 16px 8px; display: flex; justify-content: space-between; }
  .B .lbl span:last-child { color: #2fd18d; letter-spacing: .04em; text-transform: none; font-weight: 600; font-size: 11px; }
  .B .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px; }
  .B .cell { background: #121815; border: 1px solid #1c2420; border-radius: 14px; padding: 12px; }
  .B .cell.wide { grid-column: span 2; display: flex; align-items: flex-end; justify-content: space-between; }
  .B .cell .k { font-size: 11px; color: #7d8f85; font-weight: 500; }
  .B .cell .v { font-size: 20px; color: #fff; font-weight: 600; margin-top: 4px; }
  .B .cell.wide .v { font-size: 32px; letter-spacing: -0.03em; }
  .B .cell .s { font-size: 11px; color: #7d8f85; margin-top: 3px; }
  .B .up { color: #2fd18d !important; } .B .dn { color: #ff7a6b !important; } .B .am { color: #f2b544 !important; }
  .B .tanks { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 12px; }
  .B .tank { background: #121815; border: 1px solid #1c2420; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: stretch; }
  .B .tube { width: 16px; height: 74px; border-radius: 6px; background: #1b2420; position: relative; overflow: hidden; flex-shrink: 0; }
  .B .tube i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0 0 6px 6px; }
  .B .tank .n { font-size: 12px; font-weight: 700; color: #fff; }
  .B .tank .p { font-size: 18px; color: #fff; margin-top: 6px; font-weight: 600; }
  .B .tank .c { font-size: 10px; color: #7d8f85; margin-top: 2px; line-height: 1.3; }
  .B .dus { margin: 0 12px; background: #121815; border: 1px solid #1c2420; border-radius: 14px; }
  .B .du { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid #1a221e; }
  .B .du:first-child { border-top: 0; }
  .B .du .id { width: 32px; height: 32px; border-radius: 9px; background: #1a2420; color: #9fb3a8; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .B .du .nm { font-size: 13px; color: #fff; font-weight: 600; }
  .B .du .ms { font-size: 11px; color: #7d8f85; }
  .B .badge { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 4px 8px; border-radius: 99px; }
  .B .alert { margin: 0 12px 8px; display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 14px; background: #1f1712; border: 1px solid #3a2a19; }
  .B .alert.red { background: #211312; border-color: #42201d; }
  .B .alert .t { font-size: 13px; font-weight: 600; color: #fff; }
  .B .alert .m { font-size: 11px; color: #a08e7e; }
  .B .alert .go { margin-left: auto; font-size: 11px; font-weight: 700; color: #f2b544; padding: 6px 10px; border-radius: 9px; background: #2c2216; }
  .B .alert.red .go { color: #ff7a6b; background: #2f1a18; }
  .B .dock { z-index: 10; position: absolute; left: 14px; right: 14px; bottom: 22px; display: flex; justify-content: space-around; padding: 8px; border-radius: 22px; background: rgba(22,28,25,.86); backdrop-filter: blur(16px); border: 1px solid #263029; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .B .dock button { width: 52px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #6f8178; position: relative; }
  .B .dock button.on { background: #2fd18d; color: #06110c; }
  .B .dock .pip { position: absolute; top: 7px; right: 11px; width: 7px; height: 7px; border-radius: 9px; background: #ff7a6b; border: 2px solid #161c19; }

  /* ================= VARIANT C — Day story ================= */
  .C { background: #fbfaf7; color: var(--text-default); }
  .C .bar { display: flex; align-items: center; gap: 10px; padding: 2px 18px 6px; }
  .C .bar .st { font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .C .bar .me { margin-left: auto; width: 30px; height: 30px; border-radius: 99px; background: #ece6d8; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #6b5a2e; }
  .C .title { padding: 0 18px 2px; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; color: var(--text-strong); line-height: 1.1; }
  .C .title span { color: var(--text-faint); font-weight: 700; }
  .C .cards { display: flex; gap: 10px; overflow-x: auto; padding: 14px 18px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .C .dcard { scroll-snap-align: start; flex-shrink: 0; width: 262px; border-radius: 24px; padding: 18px; color: #fff; position: relative; overflow: hidden; }
  .C .dcard.today { background: radial-gradient(120% 90% at 100% 0%, #2f8a6c 0%, #1f6a53 45%, #164c3c 100%); }
  .C .dcard.past { width: 150px; background: #fff; color: var(--text-strong); border: 1px solid var(--border-soft); }
  .C .dcard .k { font-size: 12px; font-weight: 600; opacity: .8; display: flex; align-items: center; gap: 6px; }
  .C .dcard .v { font-size: 34px; font-weight: 800; letter-spacing: -0.035em; margin-top: 10px; }
  .C .dcard.past .v { font-size: 20px; margin-top: 8px; }
  .C .dcard .s { font-size: 12px; opacity: .85; margin-top: 2px; }
  .C .spark { margin-top: 14px; height: 38px; }
  .C .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; margin-top: 10px; }
  .C .quick { display: flex; gap: 8px; padding: 14px 18px 0; overflow-x: auto; scrollbar-width: none; }
  .C .qchip { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--border-soft); text-align: left; }
  .C .qchip .l { font-size: 11px; color: var(--text-muted); }
  .C .qchip .v { font-size: 14px; font-weight: 700; color: var(--text-strong); }
  .C .qchip .dot { width: 8px; height: 8px; border-radius: 9px; }
  .C h4 { margin: 0; padding: 22px 18px 10px; font-size: 13px; font-weight: 700; color: var(--text-strong); display: flex; justify-content: space-between; }
  .C h4 span { font-weight: 500; color: var(--text-faint); }
  .C .tl { padding: 0 18px 0 18px; position: relative; }
  .C .ev { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
  .C .ev::before { content: ''; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: #ece9e1; }
  .C .ev:last-child::before { display: none; }
  .C .ev .ico { width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center; flex-shrink: 0; z-index: 1; }
  .C .ev .body { flex: 1; min-width: 0; padding-top: 1px; }
  .C .ev .hd { display: flex; justify-content: space-between; gap: 8px; }
  .C .ev .t { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .C .ev .time { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .C .ev .m { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .C .ev .card { margin-top: 8px; padding: 10px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .C .ev .card b { font-size: 14px; color: var(--text-strong); }
  .C .ev .act { margin-top: 8px; display: inline-flex; font-size: 12px; font-weight: 700; color: #fff; background: var(--text-strong); padding: 7px 12px; border-radius: 10px; }
  .C .cmd { z-index: 10; position: absolute; left: 12px; right: 12px; bottom: 22px; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 20px; background: #18201a; box-shadow: 0 14px 30px -10px rgba(0,0,0,.5); }
  .C .cmd button { flex: 1; height: 42px; border-radius: 14px; color: #aab5ad; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .C .cmd button.on { background: #fff; color: #18201a; }
  .C .cmd .srch { flex: 0 0 42px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="switcher" role="toolbar" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">‹</button>
  <div><div class="lbl" id="lbl"></div><div class="dots" id="dots"></div></div>
  <button id="next" aria-label="Next variant">›</button>
</div>

<script>
/* ---------------- mock data (one realistic day) ---------------- */
const D = {
  station: 'Highway Fuels, Kozhikode', stations: 3, user: 'Abdullah', date: 'Fri, 9 Oct',
  sales: 484528, volume: 5050, deltaPct: 9.8, vsLabel: 'vs Thu at 5:12 pm',
  mix: [ { k: 'Cash', v: 231400, c: '#1f6a53' }, { k: 'UPI', v: 142300, c: '#2e8f6f' },
         { k: 'Card', v: 57800, c: '#2e5e88' }, { k: 'Credit', v: 53028, c: '#b7811e' } ],
  fuels: [ { k: 'MS', name: 'Petrol', l: 2410, v: 248037 }, { k: 'HSD', name: 'Diesel', l: 2640, v: 236491 } ],
  trend: [402, 455, 431, 470, 512, 441, 485],
  credit: 53028, purchases: 1043200, variance: -340, margin: 21450, products: 6840,
  receivables: 682400, payables: 1043200, overdue: 4,
  shift: { name: 'Shift 2', since: '2:00 pm', open: '3h 12m', attendants: 3 },
  tanks: [ { k: 'MS', pct: 62, kl: '12.4 KL', days: '2.6 days' }, { k: 'HSD', pct: 18, kl: '3.6 KL', days: '0.9 day' }, { k: 'XP95', pct: 74, kl: '7.4 KL', days: '9 days' } ],

const inr = (n, compact) => {
  if (compact) {
    const a = Math.abs(n);
    if (a >= 1e5) return (n < 0 ? '−' : '') + '₹' + (a / 1e5).toFixed(2).replace(/\.?0+$/, '') + 'L';
    if (a >= 1e3) return (n < 0 ? '−' : '') + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  }
  return (n < 0 ? '−' : '') + '₹' + Math.abs(n).toLocaleString('en-IN');
};

const sparkPath = (vals, w, h, pad = 2) => {

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', (e) => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
});
render();
</script>
