    const cur = [418, 391, 446, 430, 402, 455, 431, 470, 518, 466, 442, 461, 498];   // ₹k, 26 Sep → 8 Oct
    const prev = [402, 410, 398, 433, 421, 409, 440, 428, 455, 437, 419, 444, 451, 0];
    const W = 1100, H = 150, padL = 44, padB = 22, top = 10, n = 14;
    const lo = 360, hi = 540, X = i => padL + (i / (n - 1)) * (W - padL - 10), Y = v => top + (1 - (v - lo) / (hi - lo)) * (H - top - padB);
    const path = (arr, upto) => arr.slice(0, upto).map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const sealedTo = 11;   // indices 0..10 sealed, 11..12 draft, 13 = today
    const area = path(cur, sealedTo) + ` L${X(sealedTo - 1)} ${H - padB} L${X(0)} ${H - padB} Z`;
    const draftPath = 'M' + X(sealedTo - 1) + ' ' + Y(cur[sealedTo - 1]) + cur.slice(sealedTo).map((v, j) => ` L${X(sealedTo + j)} ${Y(v)}`).join('');
    const days = Array.from({ length: n }, (_, i) => 26 + i > 30 ? 26 + i - 30 : 26 + i);
    return `<div class="card" style="margin-top:12px">
    <div class="ch"><span class="t">Sales · last 14 business days</span>
      <div style="display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--alt);border:1px solid var(--line);margin-left:10px">${['Sales', 'Litres', 'Margin'].map((x, i) => `<button style="padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:600;${i ? 'color:var(--mu)' : 'background:var(--surface);color:var(--hi);box-shadow:0 0 0 1px var(--line)'}">${x}</button>`).join('')}</div>
      <span class="r"><span class="row" style="gap:5px"><svg width="18" height="4"><line x1="0" y1="2" x2="18" y2="2" stroke="var(--acc)" stroke-width="2"/></svg>Sealed</span>
        <span class="row" style="gap:5px"><svg width="18" height="4"><line x1="0" y1="2" x2="18" y2="2" stroke="var(--acc)" stroke-width="2" stroke-dasharray="4 3"/></svg>Draft</span>
        <span class="row" style="gap:5px"><svg width="18" height="4"><line x1="0" y1="2" x2="18" y2="2" stroke="var(--fa)" stroke-width="1.5" stroke-dasharray="2 3"/></svg>Previous 14 days</span>
        <span class="lnk" style="margin-left:6px">Reports ›</span></span></div>
    <div style="padding:10px 16px 6px"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="overflow:visible">
      <defs><linearGradient id="ar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".18"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
      ${[400, 450, 500].map(v => `<line x1="${padL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--fa)" font-family="Geist Mono">₹${(v / 100).toFixed(1).replace('.0', '')}L</text>`).join('')}
      <path d="${path(prev, 13)}" fill="none" stroke="var(--fa)" stroke-width="1.5" stroke-dasharray="2 4"/>
      <path d="${area}" fill="url(#ar)"/>
      <path d="${path(cur, sealedTo)}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="${draftPath}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-dasharray="6 5"/>
      ${cur.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === 8 ? 4.5 : 3}" fill="${i >= sealedTo ? 'var(--surface)' : 'var(--acc)'}" stroke="var(--acc)" stroke-width="2"/>`).join('')}
      <text x="${X(8)}" y="${Y(518) - 10}" text-anchor="middle" font-size="10.5" fill="var(--hi)" font-weight="700">Best · ₹5.18L</text>
      <line x1="${X(13)}" x2="${X(13)}" y1="${top}" y2="${H - padB}" stroke="var(--line2)" stroke-dasharray="3 3"/>
      <text x="${X(13)}" y="${top + 2}" text-anchor="end" dx="-6" font-size="10.5" fill="var(--mu)">today so far ₹2.2L (not plotted until closed)</text>
      ${days.map((d, i) => `<text x="${X(i)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--fa)" font-family="Geist Mono">${d}</text>`).join('')}
    </svg></div>
    <div class="row s" style="gap:20px;padding:0 16px 12px"><span>Avg/day <b class="num hi">₹4.48L</b></span><span>vs previous 14 days ${delta(448, 425)}</span><span>Best <b class="hi">Sat 4 Oct</b></span><span>2 draft days can still change</span></div>
  </div>`; })();

  const staffTodo = role !== 'Staff' ? '' : `<div class="card" style="margin-top:12px"><div class="ch"><span class="t">Your to-dos this shift</span></div>
    ${[['warn', I.cash, 'DU3 handover due', 'Vinod M · ₹10,000 dropped so far'], ['bad', I.drop, 'HSD below 20%', 'Tell the manager · 0.9 day of cover']].map(([t, p, a, m]) =>
      `<div class="alert"><span class="ai" style="background:var(--${t}-soft);color:var(--${t})">${ic(p, 15)}</span><div><div class="t">${a}</div><div class="m">${m}</div></div></div>`).join('')}</div>`;

  return `${topbarB(role)}<div class="body">${sidebar2(role)}<main class="main"><div class="page" style="max-width:none">
    ${header}${timeline}
    <div style="display:grid;grid-template-columns:${cols};gap:12px;align-items:start">${forecourt}${stock}${money}</div>
    ${staffTodo}
  </div></main></div>${statusbar()}`;
}

const GATES = `<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px">
  <tr style="color:#888"><td></td><td>Own</td><td>Mgr</td><td>Acct</td><td>Staff</td></tr>
  ${[['Timeline: shifts, stock', '✓✓✓✓'], ['Timeline: office events', '✓✓✓–'], ['Forecourt (actions)', '✓✓·✓'], ['Stock & prices', '✓✓✓✓'], ['Plan purchase / decant', '✓✓✓–'],
     ['Money column', '✓✓✓–'], ['Live margin', '✓–––'], ['14-day trend', '✓✓✓–'], ['Shift to-dos', '–––✓']].map(([n, m]) =>
    `<tr><td style="padding:2px 0">${n}</td>${[...m].map(c => `<td style="text-align:center;color:${c === '✓' ? '#7ee2b0' : c === '·' ? '#f2b544' : '#555'}">${c === '·' ? 'view' : c}</td>`).join('')}</tr>`).join('')}</table>`;
const VARIANTS = ROLES.map(r => ({ key: r[0] + (r === 'Manager' ? 'g' : ''), name: r, render: () => C2(r), notes: `<h2>C · Ops board, as ${r}</h2>
  <p>C's content with <b>B's slim top bar</b> (station in the breadcrumb, search, New, bell, avatar). No day stepper: the dashboard is always <b>today</b>; past days live in Reports.</p>
  <p>One dashboard for every web/desktop role; components are <b>gated</b>:</p>${GATES}
  <p style="margin-top:8px">Gating rules come from the shared role checks; endpoints enforce them too, and the page never asks for data the role can't see. Attendants stay mobile-only.</p>` }));

const P = new URLSearchParams(location.search);
let idx = Math.max(0, VARIANTS.findIndex(v => v.name.toLowerCase() === (P.get('role') || 'owner').toLowerCase()));
let theme = P.get('theme') === 'dark' ? 'dark' : 'light';
let notesOn = !P.get('clean');
if (P.get('clean')) document.getElementById('switcher').style.display = 'none';
function render() {
  const v = VARIANTS[idx];
  document.getElementById('root').innerHTML = `<div class="app ${theme}">${v.render()}</div>`;
  document.getElementById('lbl').innerHTML = `Ops board <span>as</span> ${v.name} <span>· ${theme}</span>`;
  const n = document.getElementById('notes'); n.style.display = notesOn ? 'block' : 'none';
  n.innerHTML = `<button class="x" onclick="toggleNotes()">✕</button>${v.notes}<p style="margin:8px 0 0;opacity:.6">←/→ switch role · t dark preview · n notes</p>`;
  try { const u = new URL(location.href); u.searchParams.set('role', v.name.toLowerCase()); u.searchParams.set('theme', theme); history.replaceState(null, '', u); } catch (e) {}
}
const go = (d) => { idx = (idx + d + VARIANTS.length) % VARIANTS.length; render(); };
function toggleNotes() { notesOn = !notesOn; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('info').onclick = toggleNotes;
addEventListener('keydown', (e) => { if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
  if (e.key === 't') { theme = theme === 'dark' ? 'light' : 'dark'; render(); } if (e.key === 'n') toggleNotes(); });
render();
</script>
</body>
</html>
