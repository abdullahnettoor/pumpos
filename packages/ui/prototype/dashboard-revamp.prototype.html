<!doctype html>
<!--
  PROTOTYPE — throwaway. Not wired to the app. Lives on branch prototype/dashboard-revamp only.
  Question: "What should the web/desktop shell + Dashboard look like?"
  Three structurally different shell + dashboard variants on the same mock day.
  Switch: floating bar, ←/→, or ?variant=A|B|C. Theme: ?theme=light|dark or "t" (dark is a preview only).
  ?clean=1 hides the notes card and switcher (for screenshots).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PumpOS desktop — Shell + Dashboard variants (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
  .light {
    --canvas: #f6f7f4; --surface: #ffffff; --alt: #f1f3ef; --line: #e1e6df; --line2: #cfd6cd;
    --hi: #18201a; --tx: #2b342d; --mu: #5e6a61; --fa: #8a948b;
    --acc: #1f6a53; --on-acc: #fff; --acc-soft: #e6f2ec; --acc-tint: #f1f8f4;
    --info: #2e5e88; --info-soft: #e8f0f7; --good: #1e7a56; --good-soft: #e6f3ec;
    --warn: #a2690b; --warn-soft: #fbf3e2; --warn-line: #efdcae; --bad: #b8443a; --bad-soft: #fbebe8; --bad-line: #f1cdc8;
    --side: #eef1ec; --track: #e8ece7; --shadow: 0 1px 2px rgba(24,32,26,.05);
    --hero: linear-gradient(120deg, #e6f2ec 0%, #f6faf7 70%);
  }
  .dark {
    --canvas: #0b0f0d; --surface: #121815; --alt: #161d1a; --line: #1f2925; --line2: #2a3530;
    --hi: #ffffff; --tx: #cfd8d2; --mu: #8a9a91; --fa: #5d6c64;
    --acc: #2fd18d; --on-acc: #06110c; --acc-soft: #143326; --acc-tint: #0f1d17;
    --info: #6cb6ff; --info-soft: #12263a; --good: #2fd18d; --good-soft: #10241b;
    --warn: #f2b544; --warn-soft: #221a10; --warn-line: #3a2a19; --bad: #ff7a6b; --bad-soft: #241514; --bad-line: #42201d;
    --side: #0e1311; --track: #1c2521; --shadow: none;
    --hero: linear-gradient(120deg, #12251c 0%, #0f1714 70%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font-sans); font-size: 13px; }

  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; letter-spacing: -0.02em; }

  /* ---------- shell pieces ---------- */
  .topbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; color: var(--hi); letter-spacing: -0.01em; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; }
  .switch { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
  .switch .ab { width: 22px; height: 22px; border-radius: 6px; background: var(--acc-soft); color: var(--acc); font-size: 10px; font-weight: 800; display: grid; place-items: center; }
  .switch .t { font-weight: 700; color: var(--hi); font-size: 13px; } .switch .s { font-size: 11px; color: var(--mu); }
  .daychip { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--tx); }
  .dot { width: 7px; height: 7px; border-radius: 9px; background: var(--good); flex-shrink: 0; }
  .live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .pill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .p-warn { background: var(--warn-soft); color: var(--warn); } .p-bad { background: var(--bad-soft); color: var(--bad); } .p-ok { background: var(--good-soft); color: var(--good); }
  .p-mu { background: var(--alt); color: var(--mu); border: 1px solid var(--line); } .p-info { background: var(--info-soft); color: var(--info); }
  .search { flex: 1; max-width: 460px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--alt); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--fa); font-size: 12.5px; }
  .kbd { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line2); color: var(--mu); background: var(--surface); }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 700; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.pri { background: var(--acc); color: var(--on-acc); } .btn.sec { border: 1px solid var(--line); background: var(--surface); color: var(--hi); }
  .btn.ghost { color: var(--acc); padding: 0 6px; }
  .ibtn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--mu); position: relative; }
  .ibtn:hover { background: var(--alt); }
  .badge { position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 9.5px; font-weight: 800; display: grid; place-items: center; padding: 0 3px; border: 2px solid var(--surface); }
  .av { width: 30px; height: 30px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-weight: 800; font-size: 11px; display: grid; place-items: center; flex-shrink: 0; }
  .statusbar { height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 14px; border-top: 1px solid var(--line); background: var(--surface); font-size: 11px; color: var(--mu); }
  .statusbar .sep { width: 1px; height: 12px; background: var(--line2); }
  .body { flex: 1; display: flex; min-height: 0; }
  .side { width: 216px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .grp { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fa); padding: 12px 8px 5px; }
  .nav { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; color: var(--mu); font-weight: 600; font-size: 13px; width: 100%; }
  .nav:hover { background: color-mix(in srgb, var(--hi) 5%, transparent); }
  .nav.on { background: var(--surface); color: var(--hi); box-shadow: 0 0 0 1px var(--line), var(--shadow); }

  .side .search, .side .switch { flex: none; }
  .switch .t { white-space: nowrap; }
  .rail { width: 60px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }

  .page { padding: 18px 22px 40px; max-width: 1360px; }

  /* ---------- content kit ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .ch { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .ch .t { font-weight: 700; color: var(--hi); font-size: 13px; } .ch .r { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--mu); }
  .lnk { color: var(--acc); font-weight: 700; font-size: 11.5px; }
  .k { font-size: 11.5px; color: var(--mu); font-weight: 500; } .s { font-size: 11px; color: var(--mu); }
  .v { color: var(--hi); font-weight: 600; }

  .stack { display: flex; gap: 2px; height: 8px; border-radius: 9px; overflow: hidden; }
  .hatch { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--acc) 38%, transparent) 0 4px, transparent 4px 8px); }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.t th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fa); font-weight: 700; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--alt); }
  table.t td { padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--tx); }
  table.t tr:last-child td { border-bottom: 0; }
  table.t .r { text-align: right; } table.t td.r { font-family: var(--font-mono); font-feature-settings: 'tnum'; }
  table.t tr.sub td { background: var(--alt); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fa); font-weight: 700; padding: 6px 14px; }
  table.t tr.tot td { font-weight: 700; color: var(--hi); background: var(--alt); }
  table.t tr:hover td { background: color-mix(in srgb, var(--acc) 4%, transparent); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
  .alert { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .alert:last-child { border-bottom: 0; }
  .alert .ai { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
  .alert .t { font-weight: 600; color: var(--hi); font-size: 12.5px; } .alert .m { font-size: 11px; color: var(--mu); }
  .alert .go { margin-left: auto; flex-shrink: 0; }
  .tube { width: 22px; height: 86px; border-radius: 7px; background: var(--track); position: relative; overflow: hidden; flex-shrink: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; }

  /* notes + switcher (not part of the design) */
  .notes { position: fixed; right: 16px; bottom: 74px; width: 330px; z-index: 900; background: #111; color: #d7d7d7; border-radius: 14px; padding: 14px 16px; font-size: 12.5px; line-height: 1.55; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .notes h2 { margin: 0 0 4px; font-size: 16px; color: #fff; } .notes b { color: #fff; } .notes ul { margin: 6px 0 0; padding-left: 16px; } .notes li { margin-bottom: 4px; }
  .notes .x { position: absolute; top: 10px; right: 12px; color: #888; }
  .switcher { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 999; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 13px; }
  .switcher button { width: 32px; height: 32px; border-radius: 99px; color: #fff; text-align: center; font-size: 15px; }
  .switcher button:hover { background: #2a2a2a; }
  .switcher .lbl { min-width: 220px; text-align: center; font-weight: 600; } .switcher .lbl span { opacity: .55; font-weight: 500; }
  .switcher .sep { width: 1px; height: 20px; background: #333; }
</style>
</head>
<body>

<div class="notes" id="notes"></div>

  <span class="sep"></span><button id="theme" title="Dark preview (t)">◐</button><button id="info" title="Notes (n)">i</button>
</div>
<script>
/* ---------------- one consistent mock day: Fri 9 Oct, Shift 1 closed, Shift 2 live ---------------- */
const D = {
  fuel: [ { k: 'MS', name: 'Petrol', l: 1060, rate: 102.92, v: 109095, c: 'var(--acc)', y: 104210 },
          { k: 'HSD', name: 'Diesel', l: 1120, rate: 89.58, v: 100330, c: 'var(--info)', y: 98120 },
          { k: 'XP95', name: 'Premium', l: 31, rate: 111.40, v: 3455, c: 'var(--warn)', y: 3010 } ],
  other: [ { k: 'Lubricants', q: 14, v: 4920 }, { k: 'Additives', q: 6, v: 1140 }, { k: 'Accessories', q: 3, v: 780 } ],

  trend: [402, 455, 431, 470, 518, 466, 219.7], trend14: [418, 391, 446, 430, 402, 455, 431, 470, 518, 466, 442, 461, 498, 0],
  margin: 21450, variance: -340, credit: 27520, purchases: 1043200, collections: 38500, expenses: 6420,

  tanks: [ { k: 'MS', name: 'Tank 1 · MS', pct: 62, kl: 12.4, cap: 20, days: 2.6 }, { k: 'HSD', name: 'Tank 2 · HSD', pct: 18, kl: 3.6, cap: 20, days: 0.9 }, { k: 'XP95', name: 'Tank 3 · XP95', pct: 74, kl: 7.4, cap: 10, days: 9 } ],

         { id: 'DU2', who: 'Sajid P', noz: 'N3 · N4 (HSD)', float: 2000, drops: 20000, st: 'Recorded', decl: 21480, var: 0 },
         { id: 'DU3', who: 'Vinod M', noz: 'N5 (HSD) · N6 (XP95)', float: 2000, drops: 10000, st: 'Handover due' } ],
  topDue: [ ['KTC Logistics', 214600, 18, 'Over limit'], ['Malabar Travels', 128900, 9, ''], ['Govt. Hospital Kzd', 96200, 32, ''], ['Sree Transports', 84300, 4, ''] ],
};
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
D.fuelV = sum(D.fuel, f => f.v); D.fuelL = sum(D.fuel, f => f.l); D.otherV = sum(D.other, o => o.v); D.total = D.fuelV + D.otherV;
const inr = (n, c) => { const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (c && a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2) + 'Cr';
  if (c && a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2).replace(/\.?0+$/, '') + 'L';
  if (c && a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return s + '₹' + a.toLocaleString('en-IN'); };
const L = (n) => n.toLocaleString('en-IN') + ' L';
const tc = (p) => p < 25 ? 'var(--bad)' : p < 40 ? 'var(--warn)' : 'var(--good)';
const ic = (p, s = 16, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  pump: '<path d="M4 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16"/><path d="M3 21h11"/><path d="M7 8h3"/><path d="M13 10h3l3 3v5a1.5 1.5 0 0 1-3 0v-4h-3"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h12l2-8H6"/>',
  bank: '<path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
  out: '<path d="M12 19V5M5 12l7-7 7 7"/>', inn: '<path d="M12 5v14M5 12l7 7 7-7"/>',
  doc: '<path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v5h5"/><path d="M8 13h8M8 17h5"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  org: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', down: '<path d="m6 9 6 6 6-6"/>', chev: '<path d="m9 6 6 6-6 6"/>', left: '<path d="m15 6-6 6 6 6"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  check: '<path d="m5 12 5 5L20 7"/>', sync: '<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M21 4v5h-5M3 20v-5h5"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z"/>', exp: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
  panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
};
const spark = (vals, w, h, p = 3) => { const v = vals.filter(x => x > 0); const mx = Math.max(...v), mn = Math.min(...v);
  return v.map((x, i) => (i ? 'L' : 'M') + ((i / (v.length - 1)) * w).toFixed(1) + ' ' + (h - p - ((x - mn) / (mx - mn || 1)) * (h - p * 2)).toFixed(1)).join(' '); };
const delta = (now, prev, invert) => { const p = ((now - prev) / prev) * 100; const up = p >= 0; const good = invert ? !up : up;
  return `<span class="num ${good ? 'good' : 'bad'}" style="font-size:11px;font-weight:600">${up ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%</span>`; };
const vbadge = (v) => v === 0 ? '<span class="pill p-ok">Balanced</span>' : `<span class="pill ${v < 0 ? 'p-bad' : 'p-warn'} num">${v > 0 ? '+' : ''}${inr(v)}</span>`;
const stPill = (s) => `<span class="pill ${s === 'Recorded' ? 'p-ok' : s === 'Pending' ? 'p-mu' : 'p-warn'}">${s}</span>`;

const NAV = [

    <span style="min-width:0"><span class="t" style="display:block">Highway Fuels</span><span class="s" style="display:block">Malabar Fuels · 3 stations</span></span><span class="fa" style="margin-left:auto">${ic(I.down, 13, 2.4)}</span></button>
    <div class="search" style="max-width:none;height:32px;margin-bottom:4px">${ic(I.search, 14)} Search<span class="kbd">⌘K</span></div>`;
  return `<div class="body">${sidebar(head)}<div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <div class="topbar">
      <button class="ibtn" title="Collapse sidebar">${ic(I.panel, 17)}</button>
      <div class="row" style="gap:4px"><button class="ibtn">${ic(I.left, 16, 2.2)}</button><div class="hi" style="font-weight:800;font-size:15px">Fri 9 Oct</div><button class="ibtn" style="opacity:.35">${ic(I.chev, 16, 2.2)}</button>
        <span class="pill p-ok" style="margin-left:4px">Today · open</span><span class="pill p-warn" style="margin-left:4px">7 & 8 Oct still open</span></div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">${topRight()}</div></div>
    <main class="main"><div class="page" style="max-width:none">
      <div class="card" style="padding:14px 16px 12px;margin-bottom:12px">
        <div class="row" style="margin-bottom:10px"><span class="hi" style="font-weight:800">Business day · 6:00 am → 6:00 am</span><span class="s" style="margin-left:10px">Day Start 6:00 · Asia/Kolkata</span>
          <span style="margin-left:auto" class="row s" style="gap:12px"><span class="sw" style="background:var(--acc)"></span>Closed shift &nbsp; <span class="sw hatch" style="background-color:transparent"></span>Running &nbsp; <span class="sw" style="background:var(--bad)"></span>Alert</span></div>
        <div style="position:relative;height:96px">
          <div style="position:absolute;left:0;right:0;top:36px;height:34px;border-radius:8px;background:var(--alt);border:1px solid var(--line)"></div>
          <div style="position:absolute;left:${x(6)}%;width:${x(13.87) - x(6)}%;top:36px;height:34px;border-radius:8px;background:var(--acc);color:var(--on-acc);padding:4px 10px;font-size:11.5px;font-weight:700;overflow:hidden">Shift 1 · <span class="num">₹2,16,120</span> · 2,211 L <span style="opacity:.75;font-weight:600">· var −₹340</span></div>
          <div class="hatch" style="position:absolute;left:${x(14)}%;width:${x(now) - x(14)}%;top:36px;height:34px;border-radius:8px;border:1.5px dashed var(--acc);padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--hi)">Shift 2 · live</div>
          <div style="position:absolute;left:${x(now)}%;top:0;bottom:4px;width:2px;background:var(--bad)"><span class="pill p-bad" style="position:absolute;top:-2px;left:4px">now 5:12 pm</span></div>
          ${ev.map(([h, icn, t, tone], i) => `<div title="${t}" style="position:absolute;left:calc(${x(h)}% - 11px);top:${i % 2 ? 76 : 8}px;width:22px;height:22px;border-radius:99px;background:var(--surface);border:1.5px solid var(--${tone === 'mu' ? 'line2' : tone});color:var(--${tone});display:grid;place-items:center">${ic(I[icn], 12, 2.2)}</div>`).join('')}
          ${[6, 9, 12, 15, 18, 21, 24, 27, 30].map(h => { const m = h % 24; const lab = m === 0 ? '12a' : m < 12 ? m + 'a' : m === 12 ? '12p' : (m - 12) + 'p';
            return `<span class="s num" style="position:absolute;bottom:-14px;left:calc(${x(h)}% - 10px);font-size:10px">${lab}</span>`; }).join('')}
        </div>
        <div class="row s" style="gap:16px;margin-top:20px;flex-wrap:wrap">${ev.map(([h, icn, t, tone]) => `<span class="row" style="gap:5px"><span class="${tone === 'mu' ? '' : tone}">${ic(I[icn], 12, 2.2)}</span>${t}</span>`).join('')}</div>
      </div>

      <div style="display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:12px;align-items:start">
        <section>
          <div class="row" style="margin:2px 2px 8px"><span class="hi" style="font-weight:800">Forecourt</span><span class="s" style="margin-left:8px">Shift 2 · 1 of 3 handed over</span><span class="lnk" style="margin-left:auto">Workspace ›</span></div>
          ${D.dus.map(d => `<div class="card" style="padding:12px 14px;margin-bottom:8px;${d.st === 'Handover due' ? 'border-color:var(--warn-line)' : ''}">
            <div class="row"><span class="av" style="border-radius:8px;width:34px;height:34px;background:var(--alt);color:var(--hi)">${d.id}</span><div style="margin-left:10px"><div class="hi" style="font-weight:700">${d.who}</div><div class="s">${d.noz}</div></div><span style="margin-left:auto">${stPill(d.st)}</span></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
              ${[['Float', inr(d.float)], ['Drops', inr(d.drops)], [d.decl ? 'Declared' : 'Declared', d.decl ? inr(d.decl) : '—']].map(([k, v]) => `<div><div class="s">${k}</div><div class="num v" style="font-size:13px">${v}</div></div>`).join('')}</div></div>`).join('')}
          <div class="card" style="padding:12px 14px"><div class="row"><span class="k">Last closed: Shift 1</span><span class="lnk" style="margin-left:auto">Summary ›</span></div>
            <div class="row" style="margin-top:6px;gap:18px"><div><div class="s">Sales</div><div class="num v">${inr(216120)}</div></div><div><div class="s">Litres</div><div class="num v">2,211</div></div><div><div class="s">Variance</div>${vbadge(-340)}</div></div></div>
        </section>

        <section>
          <div class="row" style="margin:2px 2px 8px"><span class="hi" style="font-weight:800">Stock & prices</span><span class="s" style="margin-left:8px">dip 6:00 am</span><span class="lnk" style="margin-left:auto">Inventory ›</span></div>
          ${D.tanks.map(t => `<div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;${t.pct < 25 ? 'border-color:var(--bad-line)' : ''}">
            <div class="tube" style="height:58px;width:18px"><i style="height:${t.pct}%;background:${tc(t.pct)}"></i></div>
            <div style="flex:1"><div class="row"><b class="hi">${t.name}</b><span class="num" style="margin-left:auto;font-weight:700;color:${tc(t.pct)}">${t.pct}%</span></div>
              <div class="row s" style="margin-top:3px"><span class="num">${t.kl} of ${t.cap} KL</span><span style="margin-left:auto"><b class="num ${t.days < 1.5 ? 'bad' : 'hi'}">${t.days}</b> days cover</span></div>
              ${t.pct < 25 ? '<button class="btn sec" style="height:26px;margin-top:8px;font-size:11.5px">Plan purchase</button>' : ''}</div></div>`).join('')}
          <div class="card" style="padding:12px 14px;margin-bottom:8px;border-color:var(--warn-line);background:var(--warn-soft)"><div class="row"><span class="warn">${ic(I.truck, 16)}</span><b class="hi" style="margin-left:8px">HSD tanker waiting to decant</b><span class="lnk" style="margin-left:auto">Decant ›</span></div><div class="s" style="margin-top:3px">Received 11:30 am · INV-55821 · 12 KL</div></div>
          <div class="card"><div class="ch"><span class="t">Today's prices</span><span class="r"><span class="lnk">Pricing ›</span></span></div>
            <table class="t">${D.fuel.map(f => `<tr><td><span class="sw" style="background:${f.c}"></span>${f.name}</td><td class="r hi">₹${f.rate.toFixed(2)}</td><td class="r s">since 6 Oct</td></tr>`).join('')}</table></div>
        </section>

        <section>
          <div class="row" style="margin:2px 2px 8px"><span class="hi" style="font-weight:800">Money</span><span class="s" style="margin-left:8px">office records by entry date</span><span class="lnk" style="margin-left:auto">Cash Book ›</span></div>
          <div class="card" style="padding:14px;margin-bottom:8px;background:var(--hero);border-color:color-mix(in srgb, var(--acc) 25%, var(--line))">
            <div class="k">Sales so far today</div><div class="num hi" style="font-size:28px;font-weight:600;letter-spacing:-0.04em;margin-top:2px">${inr(D.total)}</div>
            <div class="s num">${L(D.fuelL)} fuel (closed shifts) · ${inr(D.otherV)} products</div><div style="margin-top:3px">${delta(212880, 204300)} <span class="s">vs Thu Shift 1</span></div>
            <div class="row" style="gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb, var(--acc) 20%, var(--line))">
              <div><div class="s">Margin</div><div class="num good v">${inr(D.margin, true)}</div></div><div><div class="s">Credit</div><div class="num warn v">${inr(D.credit, true)}</div></div><div><div class="s">Cash in hand</div><div class="num v">${inr(D.cashInHand, true)}</div></div></div></div>
          <div class="card" style="padding:12px 14px;margin-bottom:8px">
            <div class="row"><span class="k">To collect</span><b class="num warn" style="margin-left:auto">${inr(D.receivables)}</b></div>
            <div class="stack" style="margin-top:8px;height:6px"><div style="flex:42;background:var(--good)"></div><div style="flex:31;background:var(--warn)"></div><div style="flex:27;background:var(--bad)"></div></div>
            <div class="row s" style="margin-top:5px;justify-content:space-between"><span>0–7d ₹2.87L</span><span>8–30d ₹2.11L</span><span class="bad">30d+ ₹1.84L</span></div>
            <div class="row" style="margin-top:12px"><span class="k">To pay</span><b class="num" style="margin-left:auto">${inr(D.payables)}</b></div></div>
          <div class="card"><div class="ch"><span class="t">Today in the office</span></div>
            <table class="t">${[['Collection · Sree Transports', 25000, 'good'], ['Collection · Calicut Cabs', 13500, 'good'], ['Expense · Generator diesel', -4200, 'bad'], ['Expense · Tea & snacks', -620, 'bad'], ['Income · Air pump', 1200, 'good']].map(([n, v, t]) =>
              `<tr><td>${n}</td><td class="r ${t}">${v > 0 ? '+' : ''}${inr(v)}</td></tr>`).join('')}</table></div>
        </section>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="ch"><span class="t">Last 14 business days</span><span class="r"><span class="sw" style="background:var(--acc)"></span>Sales · sealed <span class="sw" style="background:var(--warn);margin-left:8px"></span>Draft <span class="lnk" style="margin-left:10px">Reports ›</span></span></div>
        <div style="display:flex;align-items:flex-end;gap:8px;height:130px;padding:14px 16px 8px">${D.trend14.map((v, i) => {
          const draft = i === 11 || i === 12, today = i === 13; const h = today ? 42 : Math.max(8, (v - 360) / (520 - 360) * 100);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end">
            ${today ? '<span class="s" style="font-size:10px">so far</span>' : ''}<div class="${today ? 'hatch' : ''}" style="width:100%;height:${h}%;border-radius:5px 5px 2px 2px;background:${today ? '' : draft ? 'var(--warn)' : 'var(--acc)'};opacity:${draft || today ? 1 : .85}"></div>
            <span class="s num" style="font-size:10px">${26 + i > 30 ? 26 + i - 30 : 26 + i}</span></div>`; }).join('')}</div>
      </div>
    </div></main>${statusbar()}</div></div>`;
}

const VARIANTS = [
  { key: 'A', name: 'Control Room', render: A, notes: `<h2>A · Control Room</h2><p>The <b>mobile Control Room</b> brought to desktop, so the two apps feel like one product.</p>
    <ul><li><b>Station switcher and business-day chip</b> sit in the top bar (today there's no station switcher, and the day is hidden in the status bar).</li>
    <li>The sidebar is regrouped into Operate, Money, Insight and Setup, with live badges (shift running, alerts, overdue customers, days to close).</li>
    <li>A <b>live shift strip</b> runs along the top, then the honest headline (fuel from closed shifts only), with 8 tiles.</li>
    <li>Bento grid: <b>Sales by product</b> including lubes, tanks with <b>days of cover</b> and a decant prompt, Needs attention, each drawer, money position.</li>
    <li>Cash drop and Shift workspace are reachable from the header.</li></ul>` },
  { key: 'B', name: 'Briefing desk', render: B, notes: `<h2>B · Briefing desk</h2><p>Table-first, dense, Linear-style. For the owner or accountant who reads the day like a ledger.</p>
    <ul><li>An <b>icon rail</b> gives more width; the top bar holds a breadcrumb with the station switcher and a command-style search.</li>
    <li>A <b>KPI strip</b> with deltas and sparklines, and a Today / Yesterday / Week / Pick-day switch.</li>
    <li>A <b>Day sheet</b>, one statement table covering fuel by grade with rate and vs Thu, products by category, payment mix, and office records by Entry Date.</li>
    <li>A shifts-today table, plus a <b>right-rail inbox</b> where every alert has an action, along with stock cover and the top debtors.</li></ul>` },
  { key: 'C', name: 'Ops board', render: C, notes: `<h2>C · Ops board</h2><p>Organised around <b>time and place</b>: what happened today and where.</p>
    <ul><li>A Linear-style <b>workspace sidebar</b> with the station or organisation switcher and search at the top. The top bar steps through days with ‹ ›.</li>
    <li>A <b>business-day timeline</b> from Day Start to Day Start: shift blocks (closed shifts solid with their totals, the running one hatched), event pins (tanker, drops, collection, alert) and a "now" line.</li>
    <li>A three-column board: <b>Forecourt</b> (cards for each pump and attendant), <b>Stock & prices</b> (tanks, decant prompt, today's prices), <b>Money</b> (headline, receivables age, office records).</li>
    <li>A 14-day trend at the bottom, with draft days marked.</li></ul>` },
];

const P = new URLSearchParams(location.search);
let idx = Math.max(0, VARIANTS.findIndex(v => v.key === (P.get('variant') || 'A').toUpperCase()));
let theme = P.get('theme') === 'dark' ? 'dark' : 'light';
let notesOn = !P.get('clean');
if (P.get('clean')) document.getElementById('switcher').style.display = 'none';
function render() {
  const v = VARIANTS[idx];
  document.getElementById('root').innerHTML = `<div class="app ${theme}">${v.render()}</div>`;
  document.getElementById('lbl').innerHTML = `${v.key} <span>(${v.name}) · ${theme}</span>`;
  const n = document.getElementById('notes'); n.style.display = notesOn ? 'block' : 'none';
  n.innerHTML = `<button class="x" onclick="toggleNotes()">✕</button>${v.notes}<p style="margin:8px 0 0;opacity:.6">Same mock day in all variants. Dark is a preview of the future rollout only.</p>`;
  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); u.searchParams.set('theme', theme); history.replaceState(null, '', u); } catch (e) {}
}
const go = (d) => { idx = (idx + d + VARIANTS.length) % VARIANTS.length; render(); };
function toggleNotes() { notesOn = !notesOn; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('info').onclick = toggleNotes;
addEventListener('keydown', (e) => { if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1);
  if (e.key === 't') { theme = theme === 'dark' ? 'light' : 'dark'; render(); } if (e.key === 'n') toggleNotes(); });
render();
</script>
</body>
