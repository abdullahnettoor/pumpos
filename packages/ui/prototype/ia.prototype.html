<!doctype html>
<!--
  PROTOTYPE — throwaway (branch prototype/dashboard-revamp). Navigation & page structure (#540) + Insights base (#541).
  Click the sidebar, tabs and the Reports sub-navigation. ?page=customers|accounts|reports|insights|station … &theme=dark
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PumpOS desktop — Shell + Dashboard variants (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
  .light {
    --canvas: #f6f7f4; --surface: #ffffff; --alt: #f1f3ef; --line: #d9ded6; --line2: #b9c1b7;
    --hi: #18201a; --tx: #2b342d; --mu: #5e6a61; --fa: #7a857c;
    --acc: #1f6a53; --on-acc: #fff; --acc-soft: #e6f2ec; --acc-tint: #f1f8f4;
    --info: #2e5e88; --info-soft: #e8f0f7; --good: #1e7a56; --good-soft: #e6f3ec;
    --warn: #a2690b; --warn-soft: #fbf3e2; --warn-line: #efdcae; --bad: #b8443a; --bad-soft: #fbebe8; --bad-line: #f1cdc8;
    --side: #f1f3ef; --track: #f1f3ef; --shadow: none;
    --hero: linear-gradient(120deg, #e6f2ec 0%, #f6faf7 70%);
  }
  .dark {
    --canvas: #0b0f0d; --surface: #121815; --alt: #161d1a; --line: #1f2925; --line2: #2a3530;
    --hi: #ffffff; --tx: #cfd8d2; --mu: #8a9a91; --fa: #5d6c64;
    --acc: #2fd18d; --on-acc: #06110c; --acc-soft: #143326; --acc-tint: #0f1d17;
    --info: #6cb6ff; --info-soft: #12263a; --good: #2fd18d; --good-soft: #10241b;
    --warn: #f2b544; --warn-soft: #221a10; --warn-line: #3a2a19; --bad: #ff7a6b; --bad-soft: #241514; --bad-line: #42201d;
    --side: #0e1311; --track: #1c2521; --shadow: none;
    --hero: linear-gradient(120deg, #12251c 0%, #0f1714 70%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font-sans); font-size: 14px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .num { font-family: var(--font-mono); font-feature-settings: 'tnum'; letter-spacing: 0; }
  .sec-t { font-size: 12px !important; font-weight: 600 !important; color: var(--mu) !important; text-transform: uppercase; letter-spacing: .05em; }
  .app { height: 100vh; display: flex; flex-direction: column; background: var(--canvas); color: var(--tx); overflow: hidden; }
  .row { display: flex; align-items: center; }
  .hi { color: var(--hi); } .mu { color: var(--mu); } .fa { color: var(--fa); }
  .good { color: var(--good) !important; } .bad { color: var(--bad) !important; } .warn { color: var(--warn) !important; } .info { color: var(--info) !important; }

  /* ---------- shell pieces ---------- */
  .topbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--hi); letter-spacing: -0.01em; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; }
  .switch { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
  .switch .ab { width: 22px; height: 22px; border-radius: 6px; background: var(--acc-soft); color: var(--acc); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .switch .t { font-weight: 700; color: var(--hi); font-size: 13px; } .switch .s { font-size: 12px; color: var(--mu); }
  .daychip { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--tx); }
  .dot { width: 7px; height: 7px; border-radius: 9px; background: var(--good); flex-shrink: 0; }
  .live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
  .pill { font-family: var(--font-sans); font-size: 11px; font-weight: 500; height: 22px; line-height: 22px; display: inline-block; padding: 0 8px; border-radius: 99px; white-space: nowrap; }
  .p-warn { background: var(--warn-soft); color: var(--warn); } .p-bad { background: var(--bad-soft); color: var(--bad); } .p-ok { background: var(--good-soft); color: var(--good); }
  .p-mu { background: var(--alt); color: var(--mu); border: 1px solid var(--line); } .p-info { background: var(--info-soft); color: var(--info); }
  .search { flex: 1; max-width: min(420px, 38vw); height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--canvas); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--fa); font-size: 12.5px; }
  .kbd { margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-weight: 500; padding: 0 4px; height: 18px; line-height: 16px; border-radius: 4px; border: 1px solid var(--line2); border-bottom-width: 2px; color: var(--mu); background: var(--surface); }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.pri { background: var(--acc); color: var(--on-acc); } .btn.sec { border: 1px solid var(--line); background: var(--surface); color: var(--hi); }
  .btn.ghost { color: var(--acc); padding: 0 6px; }
  .ibtn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--mu); position: relative; }
  .ibtn:hover { background: var(--alt); }
  .badge { position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; border: 2px solid var(--surface); }
  .av { width: 28px; height: 28px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-weight: 700; font-size: 11px; display: grid; place-items: center; flex-shrink: 0; }
  .statusbar { height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--alt); font-size: 11.5px; color: var(--mu); }
  .statusbar .sep { width: 1px; height: 12px; background: var(--line2); }
  .body { flex: 1; display: flex; min-height: 0; }
  .side { width: 220px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .grp { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--fa); padding: 14px 8px 6px; }
  .grp:first-child { padding-top: 0; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; color: var(--tx); font-weight: 500; font-size: 13px; width: 100%; }
  .nav svg { color: var(--mu); }
  .nav:hover { background: var(--surface); color: var(--hi); }
  .nav.on { background: var(--info-soft); color: var(--info); font-weight: 600; }
  .nav.on svg { color: var(--info); }
  .nav .tail { margin-left: auto; display: flex; }
  .nav .pill { height: 20px; line-height: 20px; font-size: 10px; padding: 0 6px; }
  .side .search, .side .switch { flex: none; }
  .switch .t { white-space: nowrap; }
  .rail { width: 60px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
  .rail button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--mu); position: relative; }
  .rail button.on { background: var(--acc); color: var(--on-acc); }
  .rail .rd { width: 26px; height: 1px; background: var(--line2); margin: 6px 0; }
  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .page { padding: 24px 24px 40px; max-width: 1360px; }

  /* ---------- content kit ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .ch { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .ch .t { font-weight: 600; color: var(--mu); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; } .ch .r { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--mu); }
  .lnk { color: var(--acc); font-weight: 600; font-size: 12px; }
  .k { font-size: 11px; color: var(--mu); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; } .s { font-size: 11px; color: var(--mu); }
  .v { color: var(--hi); font-weight: 600; }
  .ttl { font-size: 18px; font-weight: 600; color: var(--hi); letter-spacing: -0.01em; line-height: 1.25 !important; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 12px; }
  .bar { height: 6px; border-radius: 9px; background: var(--track); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 9px; }
  .stack { display: flex; gap: 2px; height: 8px; border-radius: 9px; overflow: hidden; }
  .hatch { background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--acc) 38%, transparent) 0 4px, transparent 4px 8px); }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--fa); font-weight: 500; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--alt); }
  table.t td { padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--tx); }
  table.t tr:last-child td { border-bottom: 0; }
  table.t .r { text-align: right; } table.t td.r { font-family: var(--font-mono); font-feature-settings: 'tnum'; }
  table.t tr.sub td { background: var(--alt); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--fa); font-weight: 700; padding: 6px 14px; }
  table.t tr.tot td { font-weight: 700; color: var(--hi); background: var(--alt); }
  table.t tr:hover td { background: color-mix(in srgb, var(--acc) 4%, transparent); }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
  .alert { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .alert:last-child { border-bottom: 0; }
  .alert .ai { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
  .alert .t { font-weight: 600; color: var(--hi); font-size: 12.5px; } .alert .m { font-size: 11px; color: var(--mu); }
  .alert .go { margin-left: auto; flex-shrink: 0; }
  .tube { width: 22px; height: 86px; border-radius: 7px; background: var(--track); position: relative; overflow: hidden; flex-shrink: 0; }
  .tube i { position: absolute; left: 0; right: 0; bottom: 0; }

  /* notes + switcher (not part of the design) */
  .notes { position: fixed; right: 16px; bottom: 74px; width: 330px; z-index: 900; background: #111; color: #d7d7d7; border-radius: 14px; padding: 14px 16px; font-size: 12.5px; line-height: 1.55; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .notes h2 { margin: 0 0 4px; font-size: 16px; color: #fff; } .notes b { color: #fff; } .notes ul { margin: 6px 0 0; padding-left: 16px; } .notes li { margin-bottom: 4px; }
  .notes .x { position: absolute; top: 10px; right: 12px; color: #888; }
  .switcher { position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%); z-index: 999; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-size: 13px; }
  .switcher button { width: 32px; height: 32px; border-radius: 99px; color: #fff; text-align: center; font-size: 15px; }
  .switcher button:hover { background: #2a2a2a; }
  .switcher .lbl { min-width: 220px; text-align: center; font-weight: 600; } .switcher .lbl span { opacity: .55; font-weight: 500; }
  .switcher .sep { width: 1px; height: 20px; background: #333; }
  /* --- confirmation round --- */
  .app { container-type: inline-size; container-name: app; }
  .main { container-type: inline-size; container-name: main; }
  .board { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12px; align-items: start; }
  .rail2 { display: none; width: 60px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
  .rail2 button { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--mu); }
  .rail2 button.on { background: var(--info-soft); color: var(--info); }
  .rail2 .rd { width: 26px; height: 1px; background: var(--line2); margin: 6px 0; }
  @container app (max-width: 1200px) { .side { display: none; } .rail2 { display: flex; } .search .q { display: none; } }
  @container main (max-width: 1120px) {
    .board { grid-template-columns: 1fr 1fr; grid-template-areas: "f u" "m u"; }
    .board > section:nth-child(1) { grid-area: f; } .board > section:nth-child(2) { grid-area: u; } .board > section:nth-child(3) { grid-area: m; }
  }
  @container main (max-width: 760px) { .board { grid-template-columns: 1fr; grid-template-areas: none; } .board > section { grid-area: auto !important; } .notice .s { font-size: 12px !important; } }
  @container app (max-width: 900px) { .topbar .search { display: none; } }
  .skel { background: linear-gradient(90deg, var(--alt) 0%, var(--surface) 50%, var(--alt) 100%) !important; background-size: 200% 100% !important; animation: sk 1.4s linear infinite; }
  @keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .srcTag { margin: -4px 2px 8px; padding: 4px 8px; border-radius: 6px; border: 1px dashed var(--info); color: var(--info); background: var(--info-soft); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.4; }
  #ctl { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 999; display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 999px; background: #111; color: #ddd; font: 600 12px var(--font-sans); box-shadow: 0 10px 30px rgba(0,0,0,.35); white-space: nowrap; }
  #ctl label { display: flex; gap: 6px; align-items: center; }
  #ctl select { background: #222; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 4px 6px; font: inherit; }
  #ctl button { color: #ddd; padding: 4px 8px; border-radius: 8px; } #ctl button.on { background: #2fd18d; color: #06110c; }

  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-top:12px; }
  .tab { padding:8px 12px; font-size:13px; font-weight:500; color:var(--mu); border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; gap:4px; align-items:center; }
  .tab.on { color:var(--hi); font-weight:600; border-color:var(--acc); }
  .tab .mv { color:var(--info); font-size:16px; line-height:0; }
  .tb { gap:10px; margin-top:12px; flex-wrap:wrap; }
  .kpis { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; margin-top:12px; }
  .kp { padding:12px 14px; } .kp + .kp { border-left:1px solid var(--line); }
  .seg2 { display:inline-flex; gap:2px; padding:2px; border-radius:8px; background:var(--alt); border:1px solid var(--line); }
  .seg2 button { padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; color:var(--mu); }
  .seg2 button.on { background:var(--surface); color:var(--hi); box-shadow:0 0 0 1px var(--line); }
  .subnav { display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--line); padding-right:10px; }
  .subnav .grp:first-child { padding-top:0; }
  #ctl { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:999; display:flex; gap:10px; align-items:center; padding:6px 12px; border-radius:999px; background:#111; color:#ddd; font:600 12px var(--font-sans); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  #ctl button { color:#ddd; padding:4px 8px; border-radius:8px; }
  #ctl .note { position:fixed; right:16px; bottom:80px; width:340px; background:#111; color:#d7d7d7; border-radius:14px; padding:12px 14px; font-weight:400; line-height:1.5; box-shadow:0 14px 40px rgba(0,0,0,.35); }
  #ctl .note b { color:#fff; }
</style>
</head>
<body>
<div id="root"></div>
<div id="ctl"></div>
<script>
/* PROTOTYPE — navigation & page structure (#540) + Insights base (#541). Mock data. */
const ic = (p, s = 16, w = 1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  pump: '<path d="M4 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16"/><path d="M3 21h11"/><path d="M7 8h3"/><path d="M13 10h3l3 3v5a1.5 1.5 0 0 1-3 0v-4h-3"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>', tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>', truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  bank: '<path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>', out: '<path d="M12 19V5M5 12l7-7 7 7"/>', inn: '<path d="M12 5v14M5 12l7 7 7-7"/>',
  doc: '<path d="M6 2h8l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v5h5"/><path d="M8 13h8M8 17h5"/>', chart: '<path d="M3 3v18h18"/><path d="m7 15 4-5 4 3 5-7"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>', org: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>', plus: '<path d="M12 5v14M5 12h14"/>', down: '<path d="m6 9 6 6 6-6"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>', exp: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
};
const inr = (n, c) => { const a = Math.abs(n), s = n < 0 ? '−' : ''; if (c && a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2).replace(/\.?0+$/, '') + 'L'; if (c && a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k'; return s + '₹' + a.toLocaleString('en-IN'); };
const pct = (a, b) => { const p = (a - b) / b * 100; return `<span class="num ${p >= 0 ? 'good' : 'bad'}" style="font-size:11.5px;font-weight:500">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%</span>`; };
const chip = (t, l) => `<span class="pill p-${t}">${l}</span>`;
const S = { r: ['ok', 'ok'] };

/* ---------- NAV (#540) ---------- */
const NAV = [
  ['Operate', [['dashboard', 'Dashboard', I.dash], ['shifts', 'Shifts', I.pump, 'dot'], ['inventory', 'Inventory', I.box, '1'], ['pricing', 'Pricing', I.tag]]],
  ['Parties', [['customers', 'Customers', I.users, '4'], ['suppliers', 'Suppliers', I.truck]]],
  ['Books', [['accounts', 'Accounts', I.bank], ['expenses', 'Expenses', I.out], ['income', 'Income', I.inn]]],
  ['Insight', [['reports', 'Reports', I.doc, '2'], ['insights', 'Insights', I.chart, 'new']]],
  ['Setup', [['station', 'Station', I.gear], ['organization', 'Organization', I.org]]],
];

  dashboard: [], shifts: ['Live shift', 'Business days', 'History'],

function render() {
  const k = O.page;
  document.getElementById('root').innerHTML = `<div class="app ${O.theme}" style="height:100vh">${topbar(labelOf(k))}<div class="body">${sidebar()}<main class="main"><div class="page" style="max-width:none">${page()}</div></main></div>${statusbar()}</div>`;
  document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { O.page = b.dataset.page; render(); });
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { const [p, i] = b.dataset.tab.split(':'); O.tab[p] = +i; render(); });
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => { O.rep = b.dataset.rep; render(); });
  document.querySelectorAll('[data-gst]').forEach(b => b.onclick = () => { O.gst = b.dataset.gst; render(); });
  document.getElementById('ctl').innerHTML = `<span>Navigation & structure prototype</span><button data-t="theme">◐ ${O.theme}</button><button data-t="notes">notes</button>${O.notes && NOTES[k] ? `<div class="note">${NOTES[k]} <span style="opacity:.6">Tabs with • were moved or renamed.</span></div>` : ''}`;
  document.querySelector('[data-t=theme]').onclick = () => { O.theme = O.theme === 'light' ? 'dark' : 'light'; render(); };
  document.querySelector('[data-t=notes]').onclick = () => { O.notes = !O.notes; render(); };
  try { const u = new URL(location.href); u.searchParams.set('page', k); history.replaceState(null, '', u); } catch (e) {}
}
const P = new URLSearchParams(location.search);
if (P.get('page')) O.page = P.get('page'); if (P.get('tab')) O.tab[O.page] = +P.get('tab'); if (P.get('rep')) O.rep = P.get('rep'); if (P.get('theme') === 'dark') O.theme = 'dark'; if (P.get('clean')) O.notes = false;
render(); if (P.get('clean')) document.getElementById('ctl').style.display = 'none';
</script>
</body>
</html>
