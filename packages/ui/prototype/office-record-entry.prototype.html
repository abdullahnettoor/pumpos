<!doctype html>
<!--
  PROTOTYPE, throwaway (branch prototype/526-office-record-entry). Never merge into dev.
  Question (#526): what does recording an Office Record look like, the same from every entry point?
  Three variants of the entry drawer, on mock pages of the app shell:
    A  Form drawer          one kind per drawer, stacked fields, pinned footer, "Save and add another"
    B  Record desk          one wider drawer with a kind switch (from the New menu) and a log of what you saved
    C  Preview drawer       form on the left, live "what this records" on the right: ledger effect, balances, checks
  Open the file in a browser. Bottom bar or URL: ?v=A|B|C&kind=expense|income|collection|purchase|payment
  &from=page|new|statement|shifts&role=owner|manager|accountant|staff&theme=light|dark
  Keys: ←/→ variant (outside inputs), ⌘/Ctrl+Enter save, Esc close.
-->

  if (k === 'purchase') return fPType() + (style === 'grid' ? `<div class="g2">${fDate()}${fInvoice()}</div>` : fDate()) + fParty() + (style === 'grid' ? '' : fInvoice()) + fLines() + fPayNow(acct) + fNotes();
  if (style === 'grid') {
    const head = k === 'collection' ? fParty() + fMethod() : k === 'payment' ? fParty() : '';
    return head + `<div class="g2">${fDate()}${fAmount(false)}${k === 'expense' || k === 'income' ? fCategory() : ''}${fTerminal() || ''}${fAccount('select')}</div>` + fPayer() + fNotes();
  }
  if (k === 'collection') return fDate() + fParty() + fMethod() + fAmount(big) + fTerminal() + fAccount(acct) + fNotes();
  if (k === 'payment') return fDate() + fParty() + fAmount(big) + fAccount(acct) + fNotes();
  return fDate() + fCategory() + fAmount(big) + fAccount(acct) + fPayer() + fNotes();
}

/* ---------- validation, payload, effect ---------- */
function validate() {
  const e = {}, k = F.kind;
  if (!F.date) e.date = 'Choose the date.'; else if (F.date > TODAY) e.date = 'An office record can\'t be dated in the future.';
  if ((k === 'expense' || k === 'income') && !F.cat) e.cat = 'Choose a category.';
  if ((k === 'collection' || k === 'purchase' || k === 'payment') && !F.party) e.party = k === 'collection' ? 'Choose the customer who paid.' : 'Choose the supplier.';
  if (k !== 'purchase') { const a = num(F.amount); if (a == null) e.amount = 'Enter the amount.'; else if (a <= 0) e.amount = 'The amount must be more than zero.'; else if (String(F.amount).split('.')[1]?.length > 2) e.amount = 'Two decimals at most.'; }
  if (k !== 'purchase' && !(k === 'collection' && F.terminal) && !F.acct) e.acct = 'Choose the funding account.';
  if (k === 'purchase') {
    if (!F.lines.some((l) => l.p && num(l.q) > 0 && num(l.a) > 0) || F.lines.some((l) => (l.p || l.q || l.a) && !(l.p && num(l.q) > 0 && num(l.a) > 0))) e.lines = 'Each line needs a product, a quantity and an amount.';
  }
  return e;
}
function payload() {
  const k = F.kind, t = k === 'purchase' ? purchaseTotals() : null;
  const base = { entryDate: F.date, notes: F.notes || undefined };
  const p = {
    expense: () => ({ ...base, category: F.cat || null, amount: num(F.amount), fundingAccountId: F.acct || null }),
    income: () => ({ ...base, category: F.cat || null, amount: num(F.amount), fundingAccountId: F.acct || null, payer: F.payer || undefined }),
    collection: () => ({ ...base, customerId: F.party || null, method: F.method.toUpperCase(), amount: num(F.amount), terminalId: F.terminal || undefined, fundingAccountId: F.terminal ? undefined : F.acct || null }),
    payment: () => ({ ...base, supplierId: F.party || null, amount: num(F.amount), fundingAccountId: F.acct || null }),
    purchase: () => ({ [F.ptype === 'products' ? 'businessDate' : 'entryDate']: F.date, supplierId: F.party || null, kind: F.ptype.toUpperCase(), invoiceNo: F.invoice || undefined,
      lines: F.lines.filter((l) => l.p).map((l) => ({ productId: l.p, qty: num(l.q), [F.ptype === 'products' ? 'rate' : 'amount']: num(l.a) })), total: +t.total.toFixed(2),
      supplierPayment: F.payNow ? { fundingAccountId: F.payAcct || null, amount: num(F.payAmt) ?? +t.total.toFixed(2) } : undefined, notes: F.notes || undefined }),
  }[k]();
  return { endpoint: { expense: 'POST /transactions/expenses', income: 'POST /transactions/income', collection: 'POST /transactions/collections', purchase: 'POST /transactions/purchases', payment: 'POST /suppliers/:id/payments' }[k],
    headers: { 'Idempotency-Key': F.key }, attempt: F.attempt, body: p };
}
function effect() {
  const k = F.kind, a = num(F.amount) || 0, acc = acctById(F.acct), out = { moves: [], books: [], checks: [] };
  const mv = (name, before, delta) => out.moves.push({ name, before, after: before == null ? null : before + delta, delta });
  if (k === 'expense' || k === 'income') {
    if (acc) mv(acc.name, acc.bal, k === 'expense' ? -a : a);
    out.books.push([`${k === 'expense' ? 'Expense' : 'Income'}${F.cat ? ' · ' + F.cat : ''}`, a]);
    if (k === 'income' && F.cat) { const g = (CATS.income.find(([n]) => n === F.cat) || [])[1]; if (g) { out.books.push([`of which GST ${g}% (output)`, a - a / (1 + g / 100)]); } }
  }
  if (k === 'collection') {
    const c = custById(F.party); if (c) mv(`${c.name} (due)`, c.due, -a);
    if (F.terminal) out.books.push([`${TERMINALS.find((t) => t.id === F.terminal).name} clearing`, a]); else if (acc) mv(acc.name, acc.bal, a);
  }
  if (k === 'payment') { const s = supById(F.party); if (s) mv(`${s.name} (owed)`, s.owed, -a); if (acc) mv(acc.name, acc.bal, -a); }
  if (k === 'purchase') {
    const t = purchaseTotals(), s = supById(F.party);
    if (s) mv(`${s.name} (owed)`, s.owed, t.total);
    if (F.ptype === 'products') F.lines.filter((l) => l.p && num(l.q)).forEach((l) => out.books.push([`Stock + ${num(l.q)} × ${PRODUCTS.products.find((p) => p.id === l.p).name}`, null]));
    else out.checks.push(['info', 'No stock change. Fuel stock comes from Decantation (ADR 0007).']);
    if (F.payNow) { const pa = acctById(F.payAcct), amt = num(F.payAmt) ?? t.total; if (s) out.moves[0].after -= amt; if (pa) mv(pa.name, pa.bal, -amt); out.checks.push(['info', `Also saves a Supplier payment of ${inr(amt)}.`]); }
  }
  // checks
  const amount = k === 'purchase' ? purchaseTotals().total : a;
  const dup = RECORDS[k].find((r) => r.date === F.date && Math.abs(r.amt - amount) < 0.005 && amount > 0 && (k === 'expense' || k === 'income' ? r.a === F.cat : true));
  if (dup) out.checks.push(['warn', `Looks like a repeat: ${dup.a} ${inr(dup.amt)} was recorded at ${dup.time} by ${dup.by}.`]);
  if (acc && acc.bal != null && (k === 'expense' || k === 'payment') && a > acc.bal) out.checks.push(['bad', `${acc.name} would go negative (${inr(acc.bal - a)}).`]);
  if (F.date !== TODAY && k !== 'purchase') out.checks.push(['info', `Back-dated: shows in the Daily cash book for ${dm(F.date)}. No DSSR changes.`]);
  if (k === 'collection' && F.party && a > custById(F.party).due) out.checks.push(['warn', 'Collects more than is due; the rest is an advance.']);
  return out;
}

  el.style.display = 'block';
  const p = payload();
  el.innerHTML = `${NOTES[O.v]}${DECIDE}<div class="h">State: what Save would send</div><pre>${esc(JSON.stringify({ title: KINDS[F.kind].title, openedFrom: O.from, ...p }, null, 1))}</pre>
    <div class="fh" style="color:#8a8a8a;margin-top:6px">Same title, fields and body whether opened from the page, the New menu, a statement or Shifts. One key per logical submit; a retry reuses it.</div>`;
}
function renderCtl() {
  const sel = (id, opts, cur) => `<select data-ctl="${id}">${opts.map(([v, t]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  document.getElementById('ctl').innerHTML = `<button data-ctl="prev">‹</button><span class="vl">${O.v} <span>${VARIANTS[O.v].name}</span></span><button data-ctl="next">›</button>
    <label>Kind ${sel('kind', KIND_ORDER.map((k) => [k, KINDS[k].label]), F.kind)}</label>
    <label>From ${sel('from', [['page', 'Page button'], ['new', 'New menu'], ['statement', 'Statement'], ['shifts', 'Shifts hotkey']], O.from)}</label>
    <label>Role ${sel('role', Object.keys(STAFF).map((r) => [r, r[0].toUpperCase() + r.slice(1)]), O.role)}</label>
    <button data-ctl="fail" class="${O.fail ? 'on' : ''}" title="The next save fails as if offline">Fail next save</button>
    <button data-ctl="theme">${O.theme === 'dark' ? 'Light' : 'Dark'}</button><button data-ctl="notes" class="${O.notes ? 'on' : ''}">Notes</button>
    ${O.open ? '' : '<button data-ctl="reopen" class="on">Reopen</button>'}`;
}

/* ---------- render ---------- */
function render() {
  const pg = hostPage();
  const drawer = !O.open ? '' : `<div class="scrim" data-act="close"></div>${{ A: variantA, B: variantB, C: variantC }[O.v]()}`;
  document.getElementById('root').innerHTML = `<div class="app ${O.theme}">${topbar(pg)}<div class="body">${sidebar(pg)}<main class="main"><div class="page">${pageHost(pg)}</div></main></div>${statusbar()}
    ${O.from === 'statement' && ['collection', 'purchase', 'payment'].includes(F.kind) ? `<div class="scrim" style="z-index:52"></div>${statementUnder()}` : ''}${drawer}
    ${toast ? `<div class="toast">${ic(G.check, 15, 2.4)}<span>${toast}</span><button data-act="toastx">View</button></div>` : ''}</div>`;
  document.body.className = O.theme;
  renderNotes(); renderCtl();
  const q = new URLSearchParams({ v: O.v, kind: F.kind, from: O.from, role: O.role, theme: O.theme });
  history.replaceState(null, '', '?' + q.toString());
}
/* Light updates while typing: keep focus, refresh hints, preview and state. */
function soft() {
  const pv = document.getElementById('pv'); if (pv) pv.innerHTML = previewPane();
  renderNotes();
}

/* ---------- actions ---------- */
function openDrawer(kind, from) {
  if (from) O.from = from;
  if (!KINDS[kind].roles.includes(O.role)) return;
  const keep = O.v === 'B' && O.open ? { date: F.date, amount: F.amount, acct: F.acct, notes: F.notes } : null;
  F = blank(kind); if (keep) Object.assign(F, keep);
  O.open = true; O.menu = false; session = O.v === 'B' && keep ? session : [];
  render();
}
function save() {
  F.errors = validate();
  if (Object.keys(F.errors).length) { render(); return; }
  if (O.fail) { O.fail = false; F.attempt += 1; F.failed = true; render(); return; }
  F.attempt += 1;
  const k = F.kind, amt = k === 'purchase' ? purchaseTotals().total : num(F.amount);
  const acc = k === 'collection' && F.terminal ? TERMINALS.find((t) => t.id === F.terminal).name + ' clearing' : k === 'purchase' ? (F.payNow ? 'Paid · ' + (acctById(F.payAcct)?.name || '') : 'Unpaid') : acctById(F.acct)?.name;
  const a = k === 'expense' || k === 'income' ? F.cat : k === 'collection' ? custById(F.party).name : supById(F.party).name;
  const b = k === 'collection' ? `${{ cash: 'Cash', card: 'Card', upi: 'UPI', bank: 'Bank' }[F.method]}${F.notes ? ' · ' + F.notes : ''}` : k === 'purchase' ? `${F.ptype === 'fuel' ? 'Fuel' : 'Products'}${F.invoice ? ' · ' + F.invoice : ''}` : F.notes;
  const rec = { date: F.date, time: 'just now', a, b, amt, acct: acc, by: STAFF[O.role] };
  RECORDS[k].unshift(rec); justSaved = rec;
  if (k === 'purchase' && F.payNow) RECORDS.payment.unshift({ date: F.date, time: 'just now', a, b: 'With purchase ' + (F.invoice || ''), amt: num(F.payAmt) ?? amt, acct: acctById(F.payAcct)?.name, by: STAFF[O.role] });
  toast = `${KINDS[k].label} recorded · ${inr(amt)} · ${esc(a)}`;
  clearTimeout(window.__t); window.__t = setTimeout(() => { toast = null; render(); }, 3200);
  const stay = O.v === 'B' || (O.v === 'A' && O.addAnother);
  if (stay) {
    session.unshift({ kind: k, a, b, amt });
    const keep = { date: F.date, acct: F.acct, method: F.method, party: locked() ? F.party : '' };
    F = blank(k); Object.assign(F, keep);
  } else { O.open = false; }
  render();
  if (stay) setTimeout(() => document.querySelector('.drawer:not(.under) [data-f="amount"], .drawer:not(.under) [data-f="cat"]')?.focus(), 0);
}

document.addEventListener('click', (ev) => {
  const c = ev.target.closest('[data-ctl]');
  if (c) {
    const k = c.dataset.ctl;
    if (k === 'prev' || k === 'next') { const ks = Object.keys(VARIANTS); O.v = ks[(ks.indexOf(O.v) + (k === 'next' ? 1 : -1) + ks.length) % ks.length]; session = []; render(); }
    if (k === 'fail') { O.fail = !O.fail; render(); }
    if (k === 'theme') { O.theme = O.theme === 'dark' ? 'light' : 'dark'; render(); }
    if (k === 'notes') { O.notes = !O.notes; render(); }
    if (k === 'reopen') openDrawer(F.kind);
    return;
  }
  const t = ev.target.closest('[data-act]'); if (!t) { if (O.menu && !ev.target.closest('.menu')) { O.menu = false; render(); } return; }
  const [act, arg] = t.dataset.act.split(/:(.*)/s);
  if (act === 'menu') { O.menu = !O.menu; render(); }
  else if (act === 'new') openDrawer(arg, 'new');
  else if (act === 'open') openDrawer(arg);
  else if (act === 'close') { O.open = false; render(); }
  else if (act === 'save') save();
  else if (act === 'date') { F.date = arg; delete F.errors.date; render(); }
  else if (act === 'method') { F.method = arg; F.terminal = ''; F.acct = ''; render(); }
  else if (act === 'acct') { F.acct = arg; delete F.errors.acct; render(); }
  else if (act === 'payacct') { F.payAcct = arg; render(); }
  else if (act === 'ptype') { F.ptype = arg; F.lines = [{ p: '', q: '', a: '' }]; if (!locked()) F.party = ''; render(); }
  else if (act === 'addline') { F.lines.push({ p: '', q: '', a: '' }); render(); }
  else if (act === 'rmline') { F.lines.splice(+arg, 1); render(); }
  else if (act === 'kind') openDrawer(arg);
  else if (act === 'addcat') { const n = (F.newCat || '').trim(); if (n) { if (F.kind === 'income') CATS.income.push([n, 0]); else CATS.expense.push(n); CATS.expense.sort(); F.cat = n; } F.newCat = null; render(); }
  else if (act === 'nocat') { F.newCat = null; render(); }
  else if (act === 'toastx') { toast = null; O.open = false; render(); }
});
document.addEventListener('change', (ev) => {
  const c = ev.target.closest('[data-ctl]');
  if (c) {
    const k = c.dataset.ctl, v = c.value;
    if (k === 'kind') { O.open = true; F = blank(v); session = []; if (!KINDS[v].roles.includes(O.role)) O.role = 'manager'; }
    if (k === 'from') { O.from = v; O.open = true; F = blank(F.kind); session = []; }
    if (k === 'role') { O.role = v; if (!KINDS[F.kind].roles.includes(v)) { F = blank('expense'); } }
    render(); return;
  }
  const f = ev.target.dataset.f;
  if (f === 'cat' && ev.target.value === '__new') { F.newCat = ''; render(); return; }
  if (f === 'payNow') { F.payNow = ev.target.checked; render(); return; }
  if (f === 'addAnother') { O.addAnother = ev.target.checked; return; }
  if (['cat', 'party', 'acct', 'terminal', 'payAcct', 'date'].includes(f)) {
    F[f] = ev.target.value; delete F.errors[f];
    if (f === 'party' && F.kind === 'payment' && F.party && !F.amount) F.amount = String(supById(F.party).owed);
    render(); return;
  }
  if (ev.target.dataset.line) { const [i, key] = ev.target.dataset.line.split(':'); F.lines[+i][key] = ev.target.value; if (key === 'p' && F.ptype === 'products' && !F.lines[+i].a) F.lines[+i].a = String(PRODUCTS.products.find((p) => p.id === ev.target.value)?.rate ?? ''); render(); }
});
document.addEventListener('input', (ev) => {
  const f = ev.target.dataset.f;
  if (['amount', 'notes', 'payer', 'invoice', 'newCat', 'payAmt'].includes(f)) { F[f] = ev.target.value; if (F.errors[f]) { delete F.errors[f]; } soft(); }
  if (ev.target.dataset.line) { const [i, key] = ev.target.dataset.line.split(':'); F.lines[+i][key] = ev.target.value; soft(); }
});
/* Re-render on blur of amount so its hint (owed / due / GST) refreshes without stealing focus while typing. */
document.addEventListener('focusout', (ev) => { if (['amount', 'payAmt'].includes(ev.target.dataset?.f) || ev.target.dataset?.line) setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('.drawer')) render(); else { const id = document.activeElement; const sel = id.dataset.f ? `[data-f="${id.dataset.f}"]` : id.dataset.line ? `[data-line="${id.dataset.line}"]` : id.dataset.act ? `[data-act="${id.dataset.act}"]` : null; render(); if (sel) document.querySelector('.drawer:not(.under) ' + sel)?.focus(); } }, 0); });
document.addEventListener('keydown', (ev) => {
  const typing = ev.target.closest('input, textarea, select, [contenteditable]');
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter' && O.open) { ev.preventDefault(); const a = document.activeElement; if (a?.dataset?.f) { F[a.dataset.f] = a.value; } save(); return; }
  if (ev.key === 'Escape') { if (F.newCat !== null) { F.newCat = null; render(); } else if (O.menu) { O.menu = false; render(); } else if (O.open) { O.open = false; render(); } return; }
  if (typing) return;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { const ks = Object.keys(VARIANTS); O.v = ks[(ks.indexOf(O.v) + (ev.key === 'ArrowRight' ? 1 : -1) + ks.length) % ks.length]; session = []; render(); }
});
render();
</script>
</body>
</html>
