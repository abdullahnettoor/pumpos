/* tile: { id, label, value, scope ('Today'|'In range'|'Now'|month), hint, delta:{text, good}, alert:'warn'|'bad', dot, legacyTone } */
function kpiStrip(tiles, { clickable = false } = {}) {
  return `<div class="ks">${tiles.map((t) => {
    const cls = clickable && t.filter ? 'click' : ''; const sel = clickable && O.tile && O.tile === t.filter ? 'sel' : '';
    const tag = clickable && t.filter ? 'button' : 'div', act = clickable && t.filter ? `data-act="tile:${t.filter}"` : '';
    if (O.kpi === 'current') {
      const tone = t.legacyTone ? `color:var(--${t.legacyTone})` : '';
      return `<${tag} class="kc ${cls} ${sel}" ${act}><span class="l"><i style="background:var(--${t.dot || 'acc'})"></i>${esc(t.label)}</span><span class="v" style="${tone}">${t.value}</span><span class="h">${esc(t.legacyHint ?? t.hint ?? '')}</span></${tag}>`;
    }
    const delta = t.delta ? `<span class="dl ${t.delta.good === true ? 'good' : t.delta.good === false ? 'bad' : 'mu'}">${t.delta.text}</span>` : '';
    return `<${tag} class="kr ${cls} ${sel} ${t.alert ? 'alert-' + t.alert : ''}" ${act}><span class="l">${esc(t.label)}${cls ? `<span class="fa" style="font-size:11px">${sel ? '· filtering' : '· filter ›'}</span>` : ''}${t.scope ? `<span class="scope">${t.scope}</span>` : ''}</span><span class="v">${t.value}</span><span class="h">${delta}${t.hint ? `<span>${t.hint}</span>` : ''}</span></${tag}>`;
  }).join('')}</div>`;
}
const pct = (a, b) => b ? Math.round(((a - b) / b) * 100) : null;
const deltaOf = (a, b, upIsGood) => { const p = pct(a, b); if (p == null) return null; return { text: `${p > 0 ? '↑' : p < 0 ? '↓' : ''}${Math.abs(p)}%`, good: p === 0 ? null : (p > 0) === upIsGood }; };

/* ---------- Reports › Profit & loss ---------- */

  const tot = (g, key = 'v') => lines.filter((l) => g.includes(l.grp)).reduce((a, l) => a + (l[key] ?? 0), 0);
  const rev = tot(['Revenue']), gm = tot(['Revenue', 'Cost']), opx = -tot(['Expenses']), net = tot(['Revenue', 'Cost', 'Expenses']);
  const pr = { rev: tot(['Revenue'], 'p'), gm: tot(['Revenue', 'Cost'], 'p'), opx: -tot(['Expenses'], 'p'), net: tot(['Revenue', 'Cost', 'Expenses'], 'p') };
  const cmpLabel = { prev: prevLabel(O.r, O.preset), year: 'same days last year', none: '' }[O.cmp];
  const d = (a, b, up) => (prevF ? deltaOf(a, b, up) : null);

    { label: 'Revenue', scope: 'In range', value: inr0(rev), delta: d(rev, pr.rev, true), hint: prevF ? `vs ${cmpLabel}` : '', dot: 'acc', filter: 'Revenue' },
    { label: 'Gross margin', scope: 'In range', value: inr0(gm), delta: d(gm, pr.gm, true), hint: `${(gm / rev * 100).toFixed(1)}% of revenue`, dot: 'good', filter: 'Cost' },

  const table = pnlTable(lines, { rev, gm, net, pr }, prevF);

}
function pnlTable(lines, t, prevF) {
  const row = (name, v, p, cls = '') => `<tr class="${cls}"><td>${name}</td><td class="r">${inr0(v)}</td>${prevF ? `<td class="r mu">${inr0(p)}</td><td class="r ${v - p >= 0 ? '' : 'mu'}">${v - p >= 0 ? '+' : '−'}${inr0(Math.abs(v - p)).slice(v - p >= 0 ? 0 : 0)}</td>` : ''}</tr>`;
  const grp = (g) => lines.filter((l) => l.grp === g).map((l) => row(l.name, l.v, l.p, O.tile === g ? 'hl' : '')).join('');
  const sub = (name, v, p, key) => `<tr class="${O.tile === key ? 'hl' : ''}" style="font-weight:600"><td class="hi">${name}</td><td class="r hi">${inr0(v)}</td>${prevF ? `<td class="r mu">${inr0(p)}</td><td class="r">${v - p >= 0 ? '+' : '−'}${inr0(Math.abs(v - p))}</td>` : ''}</tr>`;
  const cols = prevF ? 4 : 2;
  return `<div class="card"><table class="t"><thead><tr><th>Line</th><th class="r">This period</th>${prevF ? '<th class="r">Comparison</th><th class="r">Change</th>' : ''}</tr></thead><tbody>
    <tr class="grp"><td colspan="${cols}">Revenue</td></tr>${grp('Revenue')}<tr class="grp"><td colspan="${cols}">Cost of sales</td></tr>${grp('Cost')}${sub('Gross margin', t.gm, t.pr.gm, 'Cost')}
    <tr class="grp"><td colspan="${cols}">Operating expenses</td></tr>${grp('Expenses')}</tbody>
    <tfoot><tr class="${O.tile === 'Net' ? 'hl' : ''}"><td>Net profit</td><td class="r">${inr0(t.net)}</td>${prevF ? `<td class="r mu">${inr0(t.pr.net)}</td><td class="r">${t.net - t.pr.net >= 0 ? '+' : '−'}${inr0(Math.abs(t.net - t.pr.net))}</td>` : ''}</tr></tfoot></table></div>`;
}

/* ---------- control vocabulary ---------- */
function kitPage() {
  const R = (name, ex, when, notWhen) => `<div class="k">${name}</div><div>${ex}</div><div class="w"><b class="hi">Use:</b> ${when}<br><b class="hi">Not for:</b> ${notWhen}</div>`;
  const savedRange = O.range; O.range = 'menu'; const rng = rangeCtl(); O.range = savedRange;
  return frame('Control vocabulary', 'What each control is for. One job each, so pages read the same.', '', null) + `<div class="card" style="margin-top:14px"><div class="kit">
    <div class="h">Control</div><div class="h">Looks like</div><div class="h">When</div>
    ${R('Primary button', `<button class="btn pri">${ic(G.plus, 14, 2.4)}Record expense</button>`, 'the one main action of the page, top right of the Page Frame. One per page.', 'filters, exports, secondary actions.')}
    ${R('Secondary button', `<button class="btn sec">${ic(G.tagc, 14)}Categories</button>`, 'other page actions (manage, new party), left of the primary.', 'more than two per page; group the rest in a ⋯ menu.')}
    ${R('Export menu', exportCtl(), 'PDF / CSV / print of the section below. Sits at the right end of the control bar.', 'the page header (it exports what the bar filters).')}
    ${R('Tabs', `<div class="tabs" style="margin:0"><button class="tab on">${ic(G.out, 14)}Expenses</button><button class="tab">${ic(G.pie, 14)}By category</button></div>`, 'sections of a page (different data or questions). Page Frame tabs slot, icon + label.', 'a different view of the same rows.')}
    ${R('Segmented', `<div class="seg"><button class="on">Cash</button><button>Bank</button></div>`, '2–4 ways to view or compare the same data (Cash | Bank, vs previous | vs last year).', 'filtering rows (use chips) or picking from 5+ options (use a select).')}
    ${R('Filter chips', `<div class="chips"><button class="chip on">All<span class="c">8</span></button><button class="chip warn-c">Overdue<span class="c">3</span></button></div>`, 'quick status filters with counts on a list. Counts show before you click.', 'categories or long lists (use a select).')}
    ${R('Select', catCtl(), 'one of 5+ values: category, account, product.', 'two or three choices (use segmented).')}
    ${R('Search', searchCtl('Search…'), 'free text over the rows below. Always the first filter.', 'jumping to other pages (that is ⌘K).')}
    ${R('Date range', rng, 'the period of what sits directly below it. Presets plus custom. Applies instantly.', 'a fixed-period KPI (label the tile\'s own period instead).')}
    ${R('Info tip', tipCtl('Explains how the figures are worked out.'), 'how a figure is worked out; method notes. End of the control bar.', 'instructions the operator must read to act (put those in the UI).')}
    ${R('KPI tile', `<div style="width:220px">${kpiStrip([{ label: 'Spent', scope: 'In range', value: '₹31,475.00', hint: '↑ 8% vs Sept' }])}</div>`, 'up to 4 headline figures, each with its period chip (Today · Oct · In range · Now).', 'repeating the table\'s total row, or decoration.')}
  </div></div>`;
}

/* ---------- notes ---------- */
const LAYOUT = {
  A: ['A · Toolbar', 'One control bar under the tabs drives <b>everything</b> below it: tiles, table, totals. Tiles always follow the range. The simplest rule; it drops fixed "today" figures unless the range is Today.'],
  B: ['B · Section bars', 'Fixed figures on top, each tile labelled with its own period (Today · Oct · Now). The controls sit in the <b>section header</b> of the table they filter. Matches "a control sits above what it controls".'],
  C: ['C · Summary line', 'No tiles. The range control is followed by a one-line summary of the same range. Densest; the table\'s total row carries the main figure.'],
  D: ['D · Tiles as filters', 'Like A, but tiles are buttons: clicking "From cash" or "Overdue" filters the table. Removes a separate filter control where the tiles already split the rows.'],
};
function renderNotes() {
  const el = document.getElementById('notes');
  if (!O.notes) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (O.page === 'kit') { el.innerHTML = `<h2>Control vocabulary</h2>One job per control. If a page needs a control that isn't here, that's a decision, not an improvisation.<div class="h">Proposed rules</div><ul><li>One primary action per page.</li><li>Filters apply instantly. No Apply buttons.</li><li>Order in a control bar: range · search · filters · (space) · export · info tip.</li><li>Tabs for sections, segmented for views of the same data, chips for row filters.</li></ul>`; return; }
  const [t, d] = LAYOUT[O.v];
  const page = { expenses: 'Expenses (a ledger: rows in a period)', customers: 'Customers (a list of balances, no period)', pnl: 'Reports › P&L (a report: everything follows the period)' }[O.page];
  el.innerHTML = `<h2>${t}</h2>${d}<div class="h">This page</div>${page}
    <div class="h">Range control: ${O.range}</div>${{ fields: 'Today\'s control: a period select plus two date fields, 3 controls wide.', menu: 'One button showing the preset and dates; presets and custom dates in a popover. Narrowest.', presets: 'Segmented presets; dates appear only for Custom. Fastest for the common periods.' }[O.range]}
    <div class="h">KPI: ${O.kpi}</div>${O.kpi === 'current' ? 'Today\'s KpiTile: 11px uppercase label, coloured dot, values coloured (spend in red), no period on the tile.' : 'Proposed: 12px sentence-case label, a <b>period chip</b> on every tile (Today · Oct · In range · Now), neutral values, a comparison line, and colour only for a problem (amber/red edge).'}
    <div class="h">Try</div><ul><li>Switch layouts A–D on each page (← →).</li><li>Change the range: which figures should move with it?</li><li>Customers: there's no period, so where do chips and search go?</li><li>Toggle KPI current ↔ refined.</li></ul>`;
}
function renderCtl() {
  const sel = (id, opts, cur) => `<select data-ctl="${id}">${opts.map(([v, t]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  document.getElementById('ctl').innerHTML = `<button data-ctl="prev">‹</button><span class="vl">${O.v} <span>${LAYOUT[O.v][0].split('· ')[1]}</span></span><button data-ctl="next">›</button>
    <label>Page ${sel('page', [['expenses', 'Expenses'], ['customers', 'Customers'], ['pnl', 'Reports · P&L'], ['kit', 'Control vocabulary']], O.page)}</label>
    <label>Range ${sel('range', [['menu', 'Menu'], ['presets', 'Presets'], ['fields', 'Fields (today)']], O.range)}</label>
    <label>KPI ${sel('kpi', [['refined', 'Refined'], ['current', 'Current']], O.kpi)}</label>
    <button data-ctl="theme">${O.theme === 'dark' ? 'Light' : 'Dark'}</button><button data-ctl="notes" class="${O.notes ? 'on' : ''}">Notes</button>`;
}

/* ---------- render + events ---------- */
function render() {
  const inner = { expenses: expensesPage, customers: customersPage, pnl: pnlPage, kit: kitPage }[O.page]();
  document.getElementById('root').innerHTML = shell(inner);
  document.body.className = O.theme;
  renderNotes(); renderCtl();
  history.replaceState(null, '', '?' + new URLSearchParams({ page: O.page, v: O.v, range: O.range, kpi: O.kpi, theme: O.theme }));
}
const cycle = (dir) => { const ks = ['A', 'B', 'C', 'D']; O.v = ks[(ks.indexOf(O.v) + dir + 4) % 4]; O.tile = ''; render(); };
document.addEventListener('click', (ev) => {
  const c = ev.target.closest('[data-ctl]');
  if (c) { const k = c.dataset.ctl; if (k === 'prev') cycle(-1); if (k === 'next') cycle(1); if (k === 'theme') { O.theme = O.theme === 'dark' ? 'light' : 'dark'; render(); } if (k === 'notes') { O.notes = !O.notes; render(); } return; }
  const t = ev.target.closest('[data-act]');
  if (!t) { if (O.pop || O.export) { if (!ev.target.closest('.pop')) { O.pop = false; O.export = false; render(); } } return; }
  const [a, arg] = t.dataset.act.split(/:(.*)/s);
  if (a === 'pop') O.pop = !O.pop;
  else if (a === 'export') O.export = !O.export;
  else if (a === 'preset') { if (arg === 'custom') { O.preset = 'custom'; O.pop = O.range === 'menu'; } else setPreset(arg); }
  else if (a === 'tile') O.tile = O.tile === arg ? '' : arg;
  else if (a === 'chip') O.chip = arg;
  else if (a === 'cmp') O.cmp = arg;
  else if (a === 'clear') { O.q = ''; O.cat = ''; O.tile = ''; O.chip = 'all'; }
  else if (a === 'nav') { const m = { expenses: 'expenses', customers: 'customers', reports: 'pnl' }[arg]; if (!m) return; O.page = m; O.tile = ''; O.q = ''; }
  render();
});
document.addEventListener('change', (ev) => {
  const c = ev.target.closest('[data-ctl]');
  if (c) { O[c.dataset.ctl] = c.value; O.tile = ''; O.q = ''; O.cat = ''; O.chip = 'all'; render(); return; }
  const f = ev.target.dataset.f;
  if (f === 'preset') { if (ev.target.value === 'custom') O.preset = 'custom'; else setPreset(ev.target.value); render(); }
  else if (f === 'from' || f === 'to') { O.r = { ...O.r, [f]: ev.target.value }; O.preset = 'custom'; if (O.r.from > O.r.to) O.r = { from: O.r.to, to: O.r.from }; render(); }
  else if (f === 'cat') { O.cat = ev.target.value; render(); }
});
document.addEventListener('input', (ev) => {
  if (ev.target.dataset.f !== 'q') return;
  O.q = ev.target.value; const pos = ev.target.selectionStart; render();
  const el = document.querySelector('[data-f="q"]'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && (O.pop || O.export)) { O.pop = false; O.export = false; render(); return; }
  if (ev.target.closest('input, select, textarea')) return;
  if (ev.key === 'ArrowRight') cycle(1); if (ev.key === 'ArrowLeft') cycle(-1);
});
render();
</script>
</body>
</html>
