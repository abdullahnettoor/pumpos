name: Closed shift summary PDF
environment: staging
application_url: https://console.pumpos.abdullahnettoor.com
account_role: Owner
window:
  title: PumpOS Staging - Closed shift summary PDF
  width: 1280
  height: 800
capture:
  microphone: false
  system_audio: false
  webcam: false
  upload: false
starting_state:
  description: Owner is signed in on the dashboard.
  assertion: Dashboard is visible.
mutations: []
expected_warnings:
  - Browser download notification may appear.
steps:
  - target: Dashboard navigation item
    action: click
    mutation: false
    success: Dashboard page is visible.
  - target: Shifts navigation item
    action: click
    mutation: false
    success: Shifts page is visible.
  - target: History tab
    action: click
    mutation: false
    success: Closed shifts list is visible.
  - target: Any closed shift summary row
    action: click
    mutation: false
    success: Shift summary is visible.
  - target: Save PDF action
    action: click
    mutation: false
    success: PDF is downloaded.
  - target: Downloaded PDF
    action: click
    mutation: false
    success: PDF is open and rendered.
final_state:
  assertion: Downloaded closed shift summary PDF is rendered in Chrome.
editing:
  crop:
    top_px: 0
    right_px: 0
    bottom_px: 0
    left_px: 0
  aspect_ratio: "16:9"
  auto_zoom: false
